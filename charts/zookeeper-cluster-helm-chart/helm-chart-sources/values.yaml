replicaCount: 3
image:
  registry: docker.io
  repository: zookeeper
  tag: 3.9.4
  pullPolicy: Always

service:
  type: ClusterIP
  ports:
    client: 2181
    quorum: 2888
    election: 3888

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 1
    memory: 4Gi

persistence:
  # Empty = the cluster's default StorageClass, portable across GKE/EKS/AKS. Set a
  # cloud-specific class (e.g. standard-rwo, gp3, managed-csi) via the per-cloud values overlay.
  storageClass: ""
  size: 50Gi

zookeeperConfig:
  tickTime: 2000
  initLimit: 10
  syncLimit: 5
  autopurgePurgeInterval: 1
  autopurgeSnapRetainCount: 10
  maxClientCnxns: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceAccount:
  create: true
  name: ""
  automount: true
  annotations: {}

nodeSelector: {}
tolerations: []
