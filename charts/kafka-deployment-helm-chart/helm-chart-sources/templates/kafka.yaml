---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.clusterName }}
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: {{ .Values.kafkaVersion }}
    {{- if and (not .Values.listeners.openListeners) (not .Values.listeners.authenticatedPort) }}
    {{- fail "With the open listeners closed, listeners.authenticatedPort is required" }}
    {{- end }}
    listeners:
      {{- if .Values.listeners.openListeners }}
      - name: plain
        port: {{ .Values.listeners.clientPlainPort }}
        type: internal
        tls: false
      - name: tls
        port: {{ .Values.listeners.clientTlsPort }}
        type: internal
        tls: true
      - name: internal
        port: {{ .Values.listeners.interBrokerPort }}
        type: internal
        tls: false
      {{- end }}
      {{- with .Values.listeners.authenticatedPort }}
      - name: scram
        port: {{ . }}
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
      {{- end }}
    {{- if .Values.authorization.enabled }}
    authorization:
      type: simple
      {{- with .Values.authorization.superUsers }}
      superUsers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    config:
      offsets.topic.replication.factor: {{ .Values.config.offsetsTopicReplicationFactor }}
      transaction.state.log.replication.factor: {{ .Values.config.transactionStateLogReplicationFactor }}
      transaction.state.log.min.isr: {{ .Values.config.transactionStateLogMinIsr }}
      default.replication.factor: {{ .Values.config.defaultReplicationFactor }}
      min.insync.replicas: {{ .Values.config.minInsyncReplicas }}
      log.retention.hours: {{ .Values.config.logRetentionHours }}
      {{- if .Values.config.messageMaxBytes }}
      message.max.bytes: {{ .Values.config.messageMaxBytes }}
      {{- end }}
      
  entityOperator:
    topicOperator: {}
    userOperator: {}
  {{- if .Values.cruiseControl.enabled }}
  # Cruise Control moves partition replicas between brokers. With it, Strimzi's topic operator can
  # apply a KafkaTopic's replica count to an existing topic; without it, that is NotSupported.
  cruiseControl: {{ toJson (.Values.cruiseControl.config | default dict) }}
  {{- end }}
