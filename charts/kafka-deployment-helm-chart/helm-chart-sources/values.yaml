# ---------------------------------------------------------------------------
# values.yaml — kafka chart defaults
# All actual values are supplied via helmfile values files.
# ---------------------------------------------------------------------------

# Kafka cluster
clusterName: kafka-cluster
kafkaVersion: "4.0.0"

# ---------------------------------------------------------------------------
# Listeners
# ---------------------------------------------------------------------------
listeners:
  clientPlainPort: 9092
  clientTlsPort: 9093
  interBrokerPort: 9094
  # TLS with a SCRAM-SHA-512 login, for clients whose access is limited by ACLs. 0 leaves it out.
  authenticatedPort: 0
  # Whether the listeners above that need no login stay open. Turn this off only once every client
  # uses the authenticated listener: a client still on an open one stops working.
  openListeners: true

# ---------------------------------------------------------------------------
# Authorization
# ---------------------------------------------------------------------------
# Whether brokers enforce ACLs. Until this is on, a client on any listener can use any topic.
authorization:
  enabled: false
  # Principals the ACLs don't apply to, for example User:CN=... Keep this to the operator's own.
  superUsers: []

# ---------------------------------------------------------------------------
# Broker config
# ---------------------------------------------------------------------------
config:
  offsetsTopicReplicationFactor: 3
  transactionStateLogReplicationFactor: 3
  transactionStateLogMinIsr: 2
  defaultReplicationFactor: 3
  minInsyncReplicas: 2
  logRetentionHours: 168

# ---------------------------------------------------------------------------
# Controllers (KRaft)
# ---------------------------------------------------------------------------
# Cruise Control (Strimzi-managed). Enable it wherever KafkaTopics must be able to change an existing
# topic's replica count; Strimzi then restarts the brokers once to add its metrics reporter.
# config is passed through as the Kafka resource's spec.cruiseControl.
cruiseControl:
  enabled: false
  config: {}

controllers:
  nodePoolName: kafka-controllers
  replicas: 3
  storage:
    size: 20Gi
    deleteClaim: false

# ---------------------------------------------------------------------------
# Brokers
# ---------------------------------------------------------------------------
brokers:
  nodePoolName: kafka-brokers
  replicas: 3
  storage:
    size: 100Gi
    deleteClaim: false

# ---------------------------------------------------------------------------
# KafkaUser
# ---------------------------------------------------------------------------
user:
  enabled: true
  name: kafka-user
  authentication:
    type: scram-sha-512
