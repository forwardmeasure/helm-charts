serviceAccount:
  create: false
  name: test-service-account

liquibaseWait:
  enabled: false

services:
  - name: legacy-api
    enabled: true
    deploymentMode: deployment
    image:
      repository: example/legacy-api
      tag: test
    env:
      LEGACY_SETTING: retained
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

