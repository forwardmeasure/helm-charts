registry:
  name: data-fabric-registry
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

kafka:
  bootstrapServers: kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
  topics:
    journal: apicurio-kafkasql-journal
    snapshots: apicurio-kafkasql-snapshots
    events: apicurio-registry-events
  # The Secret holding this registry's login (sasl.jaas.config, ssl.truststore.certificates). Empty
  # connects with none.
  clientSecret: ""
  # Consumer groups start with this, which its login's permissions must allow.
  groupPrefix: apicurio-

access:
  applicationNamespace: data-fabric
  # Other namespaces whose services read the registry, such as each tenant's OpenWorkflow.
  additionalApplicationNamespaces: []

# Required, no defaults: the OIDC client the registry validates tokens for and the realm's URL
# (https://<host>/realms/<realm>). Authentication and role-based authorization are always on.
auth:
  clientId: ""
  serverUrl: ""
