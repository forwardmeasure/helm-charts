apiVersion: registry.apicur.io/v1
kind: ApicurioRegistry3
metadata:
  name: {{ .Values.registry.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: apicurio-registry
    app.kubernetes.io/instance: {{ .Values.registry.name }}
    app.kubernetes.io/part-of: apicurio-registry
spec:
  app:
    replicas: {{ .Values.registry.replicas }}
    storage:
      type: kafkasql
      kafkasql:
        bootstrapServers: {{ .Values.kafka.bootstrapServers | quote }}
    env:
      - name: APICURIO_KAFKASQL_TOPIC
        value: {{ .Values.kafka.topics.journal | quote }}
      - name: APICURIO_KAFKASQL_SNAPSHOTS_TOPIC
        value: {{ .Values.kafka.topics.snapshots | quote }}
      - name: APICURIO_EVENTS_KAFKA_TOPIC
        value: {{ .Values.kafka.topics.events | quote }}
      - name: APICURIO_KAFKASQL_TOPIC_AUTO_CREATE
        value: "false"
      {{- with .Values.kafka.clientSecret }}
      # A login, and only the group names its permissions allow. Each startup's group is unique.
      - name: APICURIO_KAFKASQL_SECURITY_PROTOCOL
        value: SASL_SSL
      - name: APICURIO_KAFKA_COMMON_SASL_MECHANISM
        value: SCRAM-SHA-512
      - name: APICURIO_KAFKA_COMMON_SASL_JAAS_CONFIG
        valueFrom: {secretKeyRef: {name: {{ . | quote }}, key: sasl.jaas.config}}
      - name: APICURIO_KAFKA_COMMON_SSL_TRUSTSTORE_TYPE
        value: PEM
      - name: APICURIO_KAFKA_COMMON_SSL_TRUSTSTORE_CERTIFICATES
        valueFrom: {secretKeyRef: {name: {{ . | quote }}, key: ssl.truststore.certificates}}
      - name: APICURIO_KAFKASQL_CONSUMER_GROUP_PREFIX
        value: {{ $.Values.kafka.groupPrefix | quote }}
      {{- end }}
    # Every call is authenticated (OIDC, anonymous reads off) and authorized by the caller's realm
    # role, read from its token: sr-readonly reads, sr-developer also writes, sr-admin administers.
    # Quarkus OIDC reads a Keycloak token's realm_access.roles (and resource_access.<appClientId>.roles)
    # when it has no groups claim. Owner-only and authenticated-read access stay off: a signed-in
    # caller without one of these roles reads nothing.
    auth:
      enabled: true
      appClientId: {{ required "auth.clientId is required" .Values.auth.clientId | quote }}
      authServerUrl: {{ required "auth.serverUrl is required" .Values.auth.serverUrl | quote }}
      anonymousReadsEnabled: false
      # Required explicitly due to an operator 3.3.0 null dereference when the
      # auth TLS object is omitted. Public Keycloak certificates are verified.
      tls:
        tlsVerificationType: required
      authz:
        enabled: true
        ownerOnlyEnabled: false
        groupAccessEnabled: false
        readAccessEnabled: false
        roles:
          source: token
          admin: sr-admin
          developer: sr-developer
          readOnly: sr-readonly
    ingress:
      enabled: false
    networkPolicy:
      enabled: false
    podDisruptionBudget:
      enabled: true
    podTemplateSpec:
      spec:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: apicurio-registry
                app.kubernetes.io/instance: {{ .Values.registry.name }}
                app.kubernetes.io/component: app
        containers:
          - name: apicurio-registry-app
            resources:
              {{- toYaml .Values.registry.resources | nindent 14 }}
            startupProbe:
              httpGet:
                path: /health/started
                port: management
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 30
  # The registry has no UI. Apicurio operator 3.3.0 counted a disabled UI Deployment as active and
  # left the Registry's Ready condition false (its readiness code is unchanged in 3.3.3), so the UI
  # component stays enabled at zero replicas: no UI pod runs, and nothing routes to it.
  ui:
    enabled: true
    replicas: 0
    ingress:
      enabled: false
    networkPolicy:
      enabled: false
    podDisruptionBudget:
      enabled: false
