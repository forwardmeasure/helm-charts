apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio-registry-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apicurio-registry-operator.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apicurio-registry-operator
  template:
    metadata:
      labels:
        {{- include "apicurio-registry-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: apicurio-registry-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apicurio-registry-operator
          image: {{ .Values.image.reference | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APICURIO_OPERATOR_WATCHED_NAMESPACES
              value: {{ .Release.Namespace | quote }}
            - name: QUARKUS_PROFILE
              value: prod
            - name: REGISTRY_APP_IMAGE
              value: {{ .Values.registryImages.app | quote }}
            - name: REGISTRY_UI_IMAGE
              value: {{ .Values.registryImages.ui | quote }}
            - name: REGISTRY_GITOPS_SYNC_IMAGE
              value: {{ .Values.registryImages.gitOpsSync | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 14
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
