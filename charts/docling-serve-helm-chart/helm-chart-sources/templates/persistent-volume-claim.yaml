{{- if and (not .Values.persistence.existingClaim) .Values.persistence.create }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "docling-serve.claimName" . }}
  {{- if .Values.persistence.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "docling-serve.labels" . | nindent 4 }}
    purpose: model-cache
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- else if or .Values.persistence.bindToPv .Values.persistence.volumeName }}
  storageClassName: ""
  {{- end }}
  {{- if or .Values.persistence.bindToPv .Values.persistence.volumeName }}
  volumeName: {{ include "docling-serve.pvName" . | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.persistence.size | quote }}}
{{- end }}
