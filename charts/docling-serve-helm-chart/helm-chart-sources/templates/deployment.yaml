{{- include "docling-serve.validate" . -}}
{{- $gpu := eq .Values.mode "gpu" -}}
{{- $pvc := eq (include "docling-serve.modelSource" .) "pvc" -}}
{{- $res := index .Values.resources .Values.mode .Values.pipeline -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docling-serve.fullname" . }}
  labels:
    {{- include "docling-serve.labels" . | nindent 4 }}
  annotations:
    docling-serve/mode: {{ .Values.mode | quote }}
    docling-serve/pipeline: {{ .Values.pipeline | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "docling-serve.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "docling-serve.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
        docling-serve/mode: {{ .Values.mode | quote }}
        docling-serve/pipeline: {{ .Values.pipeline | quote }}
      annotations:
        {{- $annotations := deepCopy .Values.podAnnotations -}}
        {{- $_ := set $annotations "checksum/configuration" (toJson .Values | sha256sum) -}}
        {{- if $pvc -}}
        {{- $_ := set $annotations "checksum/model-preparation" (include (print .Template.BasePath "/model-download-lib-configmap.yaml") . | sha256sum) -}}
        {{- end -}}
        {{- toYaml $annotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "docling-serve.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $selector := deepCopy .Values.nodeSelector -}}
      {{- $tolerations := .Values.tolerations -}}
      {{- if $gpu -}}
      {{- $selector = mergeOverwrite $selector .Values.gpu.nodeSelector -}}
      {{- $tolerations = concat $tolerations .Values.gpu.tolerations -}}
      {{- end }}
      {{- with $selector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: runtime-cache
          emptyDir: {sizeLimit: {{ .Values.runtimeStorage.cacheSizeLimit | quote }}}
        - name: scratch
          emptyDir: {sizeLimit: {{ .Values.runtimeStorage.scratchSizeLimit | quote }}}
        - name: temporary
          emptyDir: {sizeLimit: {{ .Values.runtimeStorage.temporarySizeLimit | quote }}}
        {{- if $pvc }}
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ include "docling-serve.claimName" . }}
        - name: model-download-lib
          configMap:
            name: {{ include "docling-serve.libraryName" . }}
            defaultMode: 0444
        {{- if and .Values.modelDownload.enabled (eq .Values.modelDownload.preparation "init") }}
        - name: hf-download-staging
          emptyDir: {sizeLimit: {{ .Values.modelDownload.stagingSizeLimit | quote }}}
        {{- end }}
        {{- end }}
      {{- if $pvc }}
      initContainers:
        {{- if .Values.initContainer.enabled }}
        - name: fix-permissions
          image: {{ .Values.initContainer.image | quote }}
          command: [sh, -ec]
          args:
            - 'mkdir -p "$1" && chown "$2:$3" "$1" && chmod 0770 "$1"'
            - fix-permissions
            - {{ .Values.paths.models | quote }}
            - {{ .Values.podSecurityContext.runAsUser | quote }}
            - {{ .Values.podSecurityContext.fsGroup | quote }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [CHOWN, FOWNER, DAC_OVERRIDE]}
          volumeMounts:
            - {name: model-cache, mountPath: {{ .Values.paths.models | quote }}}
          resources:
            {{- toYaml .Values.initContainer.resources | nindent 12 }}
        {{- end }}
        {{- if and .Values.modelDownload.enabled (eq .Values.modelDownload.preparation "init") }}
        - name: prepare-models
          {{- include "docling-serve.preparationContainer" . | nindent 10 }}
        {{- else }}
        - name: verify-models
          image: {{ include "docling-serve.preparationImage" . | quote }}
          imagePullPolicy: {{ (index .Values.modelDownload.image (ternary "cpu" .Values.mode .Values.modelDownload.useCpuImage)).pullPolicy }}
          command: [python, -B, /scripts/model-preparation.py]
          args:
            - verify
            - --config
            - /scripts/models.json
            - --cache
            - {{ .Values.paths.models | quote }}
            {{- if .Values.modelDownload.enabled }}
            - --wait-timeout
            - {{ .Values.modelDownload.job.activeDeadlineSeconds | quote }}
            {{- else }}
            - --legacy
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml (index .Values.modelDownload.resources (ternary "cpu" .Values.mode .Values.modelDownload.useCpuImage)) | nindent 12 }}
          volumeMounts:
            - {name: model-cache, mountPath: {{ .Values.paths.models | quote }}, readOnly: true}
            - {name: model-download-lib, mountPath: /scripts, readOnly: true}
            - {name: temporary, mountPath: /tmp}
        {{- end }}
      {{- end }}
      containers:
        - name: docling-serve
          image: {{ include "docling-serve.image" . | quote }}
          imagePullPolicy: {{ (index .Values.image .Values.mode).pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - {containerPort: {{ .Values.containerPort }}, name: http}
          env:
            - {name: DOCLING_SERVE_ARTIFACTS_PATH, value: {{ include "docling-serve.artifactsPath" . | quote }}}
            - {name: HF_HOME, value: {{ printf "%s/huggingface" .Values.paths.cache | quote }}}
            - {name: HF_HUB_CACHE, value: {{ printf "%s/huggingface/hub" .Values.paths.cache | quote }}}
            - {name: DOCLING_SERVE_SCRATCH_PATH, value: {{ .Values.paths.scratch | quote }}}
            - {name: DOCLING_SERVE_ENG_KIND, value: {{ .Values.engine.kind | quote }}}
            - {name: DOCLING_SERVE_MAX_FILE_SIZE, value: {{ printf "%d" (int64 .Values.limits.maxFileSize) | quote }}}
            - {name: DOCLING_SERVE_MAX_NUM_PAGES, value: {{ printf "%d" (int64 .Values.limits.maxNumPages) | quote }}}
            - {name: DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT, value: {{ .Values.limits.maxDocumentTimeout | quote }}}
            - {name: DOCLING_SERVE_MAX_SOURCES_PER_REQUEST, value: {{ printf "%d" (int64 .Values.limits.maxSourcesPerRequest) | quote }}}
            - {name: DOCLING_SERVE_MAX_IMAGES_SCALE, value: {{ .Values.limits.maxImagesScale | quote }}}
            {{- if .Values.auth.enabled }}
            - name: DOCLING_SERVE_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.auth.existingSecret | quote }}, key: {{ .Values.auth.secretKey | quote }}}
            {{- end }}
            {{- if ne .Values.engine.kind "local" }}
            - name: {{ ternary "DOCLING_SERVE_ENG_RQ_REDIS_URL" "DOCLING_SERVE_ENG_RAY_REDIS_URL" (eq .Values.engine.kind "rq") }}
              valueFrom:
                secretKeyRef: {name: {{ .Values.engine.redisSecret.name | quote }}, key: {{ .Values.engine.redisSecret.key | quote }}}
            {{- end }}
            {{- $allowedVlm := list -}}
            {{- if ne .Values.pipeline "standard" }}
            - {name: DOCLING_SERVE_DEFAULT_VLM_PRESET, value: {{ (index .Values.pipelines .Values.pipeline).vlmPreset | quote }}}
            {{- $allowedVlm = append $allowedVlm (index .Values.pipelines .Values.pipeline).vlmPreset -}}
            {{- end }}
            {{- range $k := .Values.modelDownload.includeVlm -}}
            {{- $p := (index $.Values.pipelines $k).vlmPreset -}}
            {{- if not (has $p $allowedVlm) -}}{{- $allowedVlm = append $allowedVlm $p -}}{{- end -}}
            {{- end -}}
            {{- if $allowedVlm }}
            - {name: DOCLING_SERVE_ALLOWED_VLM_PRESETS, value: {{ join "," $allowedVlm | quote }}}
            {{- end }}
            {{- $env := deepCopy .Values.env -}}
            {{- if $gpu -}}
            {{- $env = mergeOverwrite $env .Values.gpuEnv -}}
            {{- end }}
            {{- range $name, $value := $env }}
            - {name: {{ $name }}, value: {{ $value | quote }}}
            {{- end }}
            {{- range $name, $ref := .Values.envSecretRefs }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  {{- toYaml $ref | nindent 18 }}
            {{- end }}
          volumeMounts:
            - {name: runtime-cache, mountPath: {{ .Values.paths.cache | quote }}}
            - {name: scratch, mountPath: {{ .Values.paths.scratch | quote }}}
            - {name: temporary, mountPath: /tmp}
            {{- if $pvc }}
            - {name: model-cache, mountPath: {{ .Values.paths.models | quote }}, readOnly: true}
            {{- end }}
          resources:
            {{- $requests := deepCopy $res.requests -}}
            {{- $limits := deepCopy $res.limits -}}
            {{- if $gpu -}}
            {{- $_ := set $requests "nvidia.com/gpu" .Values.gpu.count -}}
            {{- $_ := set $limits "nvidia.com/gpu" .Values.gpu.count -}}
            {{- end }}
            requests:
              {{- toYaml $requests | nindent 14 }}
            limits:
              {{- toYaml $limits | nindent 14 }}
          startupProbe:
            httpGet: {path: {{ .Values.probes.startup.path | quote }}, port: http}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ default $res.startupProbeFailureThreshold .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet: {path: {{ .Values.probes.liveness.path | quote }}, port: http}
            initialDelaySeconds: {{ $res.livenessInitialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet: {path: {{ .Values.probes.readiness.path | quote }}, port: http}
            initialDelaySeconds: {{ $res.readinessInitialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
