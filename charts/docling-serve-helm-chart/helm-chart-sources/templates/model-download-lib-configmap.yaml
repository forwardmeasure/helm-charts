{{- if eq (include "docling-serve.modelSource" .) "pvc" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "docling-serve.libraryName" . }}
  labels:
    {{- include "docling-serve.labels" . | nindent 4 }}
data:
  models.json: |
    {{- include "docling-serve.modelConfig" . | nindent 4 }}
  model-preparation.py: |
    {{- .Files.Get "files/model-preparation.py" | nindent 4 }}
{{- end }}
