{{- if and (not .Values.persistence.existingClaim) .Values.persistence.create .Values.persistence.bindToPv }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "docling-serve.pvName" . }}
  {{- if .Values.persistence.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "docling-serve.labels" . | nindent 4 }}
    purpose: model-cache
spec:
  capacity: {storage: {{ .Values.persistence.size | quote }}}
  volumeMode: Filesystem
  accessModes: [{{ .Values.persistence.accessMode }}]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: {{ include "docling-serve.claimName" . }}
  {{- with .Values.persistence.nodeAffinity }}
  nodeAffinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- toYaml .Values.persistence.volumeSource | nindent 2 }}
{{- end }}
