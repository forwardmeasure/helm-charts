# See README.md for upgrade, model preparation, authentication and storage contracts.
# The release script reads image.tag for appVersion; Chart.yaml versions are left to it.
# auto uses PVC when modelDownload.enabled=true, otherwise image-bundled standard models.
# persistence.create stays true to preserve legacy Helm-owned PVCs during upgrades.
replicaCount: 1
nameOverride: ''
fullnameOverride: ''
podAnnotations: {}
mode: cpu
pipeline: standard
image:
  cpu:
    repository: quay.io/docling-project/docling-serve-cpu
    tag: ''
    pullPolicy: IfNotPresent
    digest: sha256:6eda9c524992147c1b0b06a1a9be4894bd68b1f43c86d92c32f996c4c60d18a3
  gpu:
    repository: quay.io/docling-project/docling-serve-cu128
    tag: ''
    pullPolicy: IfNotPresent
    digest: sha256:2aa6fc687c9211911b51ad2a60c33028358973fd053be9dd1cc4646017dfc76d
  tag: v1.37.0
containerPort: 5001
env:
  DOCLING_SERVE_ENABLE_UI: '0'
  DOCLING_SERVE_LOAD_MODELS_AT_BOOT: '1'
  DOCLING_SERVE_ENG_LOC_NUM_WORKERS: '1'
  DOCLING_SERVE_ENG_LOC_SHARE_MODELS: 'true'
  DOCLING_SERVE_DEFAULT_CODE_FORMULA_PRESET: codeformulav2
  DOCLING_SERVE_DEFAULT_LAYOUT_PRESET: docling_layout_default
  DOCLING_SERVE_DEFAULT_TABLE_STRUCTURE_PRESET: tableformer_v1_accurate
  DOCLING_SERVE_DEFAULT_PICTURE_CLASSIFICATION_PRESET: document_figure_classifier_v2
  DOCLING_SERVE_LOG_FORMAT: json
paths:
  models: /opt/docling-serve/models
  cache: /opt/docling-serve/cache
  imageModels: /opt/app-root/src/.cache/docling/models
  scratch: /opt/docling-serve/scratch
persistence:
  existingClaim: ''
  create: true
  accessMode: ReadWriteOnce
  size: 64Gi
  storageClass: ''
  bindToPv: false
  retain: true
  volumeName: ''
  volumeSource: {}
  nodeAffinity: {}
serviceAccount:
  create: true
  name: ''
  annotations: {}
  automountServiceAccountToken: false
initContainer:
  enabled: false
  image: alpine:3.20
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
modelDownload:
  enabled: false
  image:
    cpu:
      repository: ''
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    gpu:
      repository: ''
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
  resources:
    cpu:
      requests:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
        ephemeral-storage: 16Gi
    gpu:
      requests:
        cpu: 500m
        memory: 2Gi
        ephemeral-storage: 2Gi
      limits:
        cpu: 2000m
        memory: 6Gi
        ephemeral-storage: 16Gi
  ensembleModels:
  - layout
  - tableformer
  - code_formula
  - picture_classifier
  - easyocr
  - rapidocr
  hfRepos:
    vlm-small: ibm-granite/granite-docling-258M
    vlm-large: ibm-granite/granite-vision-3.2-2b
  preparation: init
  useCpuImage: true
  stagingSizeLimit: 16Gi
  lockTimeoutSeconds: 600
  revisions:
    vlm-small: 982fe3b40f2fa73c365bdb1bcacf6c81b7184bfe
    vlm-large: ec894191f2e9e9be3d90eab9ac6949583c46f03b
  job:
    backoffLimit: 2
    activeDeadlineSeconds: 3600
    ttlSecondsAfterFinished: 86400
    nodeSelector: {}
    affinity: {}
    tolerations: []
  namedModels:
    layout:
    - repo: docling-project/docling-layout-heron
      revision: 8f39ad3c0b4c58e9c2d2c84a38465abf757272d8
      requiredFiles:
      - config.json
      - model.safetensors
      sha256:
        model.safetensors: 00333a43451945aaf89db8ca9c0a17e75d1537c17db60fdb91aa95f4c7929e0c
    - repo: docling-project/docling-layout-heron-onnx
      revision: 40bde044036bb181c130ddf6c51792187268748f
      requiredFiles:
      - config.json
      - model.onnx
      sha256:
        model.onnx: 59c81a3a2923042d85034ffc487f8f47e4854117e879aef89b2b9f728fb4922a
    tableformer:
    - repo: docling-project/docling-models
      revision: 2199320848bb9a8a519d22e4b528185a4f9a6f64
      requiredFiles:
      - model_artifacts/tableformer/accurate/tableformer_accurate.safetensors
      - model_artifacts/tableformer/fast/tableformer_fast.safetensors
      sha256:
        model_artifacts/tableformer/accurate/tableformer_accurate.safetensors: 2a7d6c924b3cd12fb99a09280ca9c33a89c5d60b93253617d2e088c1a40374d9
        model_artifacts/tableformer/fast/tableformer_fast.safetensors: 3119563aab5a7c96fda4d621119b63fd8806272b86c30936d15507616422f718
      allowPatterns:
      - config.json
      - model_artifacts/tableformer/**
    code_formula:
    - repo: docling-project/CodeFormulaV2
      revision: ecedbe111d15c2dc60bfd4a823cbe80127b58af4
      requiredFiles:
      - config.json
      - model.safetensors
      - processor_config.json
      sha256:
        model.safetensors: 4b04e77af34c4e682a7ab1617628340d658f3c3dcd12456dd2a7fff805cf79d2
    picture_classifier:
    - repo: docling-project/DocumentFigureClassifier-v2.5
      revision: f859dfbff5c9916cd996942d4b0db7fa25808220
      requiredFiles:
      - config.json
      - model.safetensors
      - model.onnx
      sha256:
        model.safetensors: 6bf1e44d6bce316dcade6eb9929d8f8d23b6e8d9d29062b3b4011cff87c7c3cd
        model.onnx: 27ffc48c27ae4e12c99b6f6de0dd730005245e47b70dd0c1339e62cbac3ec4c0
    easyocr:
    - directory: EasyOcr
      requiredFiles:
      - craft_mlt_25k.pth
      - english_g2.pth
      - latin_g2.pth
    rapidocr:
    - directory: RapidOcr
      requiredFiles:
      - PP-OCRv6_det_small.onnx
      - PP-OCRv6_rec_small.onnx
      - ch_ppocr_mobile_v2.0_cls_mobile.onnx
      - PP-OCRv6_det_small.pth
      - PP-OCRv6_rec_small.pth
      - ch_ppocr_mobile_v2.0_cls_mobile.pth
      - ppocrv6_dict.txt
gpu:
  count: 1
  nodeSelector:
    cloud.google.com/gke-accelerator: nvidia-l4
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
gpuEnv:
  DOCLING_DEVICE: cuda:0
  DOCLING_SERVE_LAYOUT_BATCH_SIZE: '64'
  DOCLING_SERVE_TABLE_BATCH_SIZE: '8'
  DOCLING_SERVE_OCR_BATCH_SIZE: '16'
resources:
  cpu:
    standard:
      requests:
        cpu: 500m
        memory: 2Gi
        ephemeral-storage: 1Gi
      limits:
        cpu: 2000m
        memory: 6Gi
        ephemeral-storage: 20Gi
      startupProbeFailureThreshold: 40
      livenessInitialDelaySeconds: 0
      readinessInitialDelaySeconds: 0
    vlm-small:
      requests:
        cpu: 1000m
        memory: 4Gi
        ephemeral-storage: 1Gi
      limits:
        cpu: 4000m
        memory: 12Gi
        ephemeral-storage: 20Gi
      startupProbeFailureThreshold: 60
      livenessInitialDelaySeconds: 0
      readinessInitialDelaySeconds: 0
  gpu:
    standard:
      requests:
        cpu: 500m
        memory: 4Gi
        ephemeral-storage: 1Gi
      limits:
        cpu: 4000m
        memory: 12Gi
        ephemeral-storage: 20Gi
      startupProbeFailureThreshold: 40
      livenessInitialDelaySeconds: 0
      readinessInitialDelaySeconds: 0
    vlm-small:
      requests:
        cpu: 1000m
        memory: 8Gi
        ephemeral-storage: 1Gi
      limits:
        cpu: 4000m
        memory: 16Gi
        ephemeral-storage: 20Gi
      startupProbeFailureThreshold: 40
      livenessInitialDelaySeconds: 0
      readinessInitialDelaySeconds: 0
    vlm-large:
      requests:
        cpu: 2000m
        memory: 16Gi
        ephemeral-storage: 1Gi
      limits:
        cpu: 8000m
        memory: 32Gi
        ephemeral-storage: 20Gi
      startupProbeFailureThreshold: 40
      livenessInitialDelaySeconds: 0
      readinessInitialDelaySeconds: 0
pipelines:
  standard:
    type: ensemble
    vlmModelId: ''
    vlmPreset: ''
  vlm-small:
    type: vlm
    vlmModelId: ibm-granite/granite-docling-258M
    vlmPreset: granite_docling
  vlm-large:
    type: vlm
    vlmModelId: ibm-granite/granite-vision-3.2-2b
    vlmPreset: granite_vision
probes:
  startup:
    path: /ready
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 0
  liveness:
    path: /livez
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /ready
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
service:
  type: ClusterIP
  port: 5001
  name: http
hfToken:
  secretName: ''
  secretKey: token
modelSource: auto
imagePullSecrets: []
strategy:
  type: Recreate
terminationGracePeriodSeconds: 60
envSecretRefs: {}
engine:
  kind: local
  redisSecret:
    name: ''
    key: url
auth:
  enabled: false
  existingSecret: ''
  secretKey: api-key
limits:
  maxFileSize: 104857600
  maxNumPages: 1000
  maxDocumentTimeout: 3600
  maxSourcesPerRequest: 3
  maxImagesScale: 2
runtimeStorage:
  cacheSizeLimit: 8Gi
  scratchSizeLimit: 8Gi
  temporarySizeLimit: 1Gi
nodeSelector: {}
affinity: {}
tolerations: []
networkPolicy:
  enabled: false
  ingress: []
  egress: null
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 0
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
