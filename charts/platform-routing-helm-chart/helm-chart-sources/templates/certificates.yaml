{{- if .Values.clusterIssuer.enabled }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
spec:
  acme:
    server: {{ .Values.clusterIssuer.server }}
    email: {{ .Values.clusterIssuer.email }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.privateKeySecretRef }}
    # Solver-agnostic: the consumer's per-cloud overlay supplies the full solver list
    # (GCP cloudDNS, AWS route53, Azure azureDNS). This chart stays cloud-neutral.
    solvers:
      {{- toYaml .Values.clusterIssuer.solvers | nindent 6 }}
{{- end }}

{{- range .Values.routes }}
{{- if .certificate }}
{{- if .certificate.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}-cert
  namespace: {{ $.Values.gateway.namespace }}
spec:
  secretName: {{ .certificate.secretName }}
  issuerRef:
    name: {{ $.Values.clusterIssuer.name }}
    kind: ClusterIssuer
  commonName: {{ first .hostnames | quote }}
  dnsNames:
    {{- range .hostnames }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
