apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "decision-engine.fullname" . }}
  labels:
    {{- include "decision-engine.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "decision-engine.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "decision-engine.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "decision-engine.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        {{- if or .Values.migration.enabled .Values.postgresql.enabled }}
        - name: database-migration
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: DECISION_ENGINE_DATABASE_URL
              value: {{ if .Values.postgresql.enabled }}{{ printf "jdbc:postgresql://%s-postgresql:5432/%s" .Release.Name .Values.postgresql.auth.database | quote }}{{ else }}{{ .Values.database.url | quote }}{{ end }}
            {{- if .Values.postgresql.enabled }}
            - name: DECISION_ENGINE_DATABASE_USERNAME
              value: {{ .Values.migration.administratorUsername | quote }}
            - name: DECISION_ENGINE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgresql" .Release.Name }}
                  key: {{ .Values.migration.administratorPasswordKey }}
            - name: DECISION_ENGINE_RUNTIME_DATABASE_USERNAME
              value: {{ .Values.database.runtimeUsername | quote }}
            - name: DECISION_ENGINE_RUNTIME_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgresql" .Release.Name }}
                  key: {{ .Values.migration.runtimeDatabasePasswordKey }}
            {{- else }}
            - name: DECISION_ENGINE_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.adminCredentialsSecret }}
                  key: username
            - name: DECISION_ENGINE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.adminCredentialsSecret }}
                  key: password
            - name: DECISION_ENGINE_RUNTIME_DATABASE_USERNAME
              value: {{ .Values.database.runtimeUsername | quote }}
            - name: DECISION_ENGINE_RUNTIME_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.credentialsSecret }}
                  key: password
            {{- end }}
        {{- end }}
        - name: decision-engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
          env:
            - name: DECISION_ENGINE_DATABASE_URL
              value: {{ if .Values.postgresql.enabled }}{{ printf "jdbc:postgresql://%s-postgresql:5432/%s" .Release.Name .Values.postgresql.auth.database | quote }}{{ else }}{{ .Values.database.url | quote }}{{ end }}
            - name: DECISION_ENGINE_DATABASE_USERNAME
              {{- if .Values.postgresql.enabled }}
              value: {{ .Values.database.runtimeUsername | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.credentialsSecret }}
                  key: username
              {{- end }}
            - name: DECISION_ENGINE_DATABASE_PASSWORD
              {{- if .Values.postgresql.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgresql" .Release.Name }}
                  key: {{ .Values.migration.runtimeDatabasePasswordKey }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.credentialsSecret }}
                  key: password
              {{- end }}
            - name: DECISION_ENGINE_VALKEY_HOST
              value: {{ if .Values.valkey.enabled }}{{ printf "%s-valkey-primary" .Release.Name | quote }}{{ else }}{{ .Values.factWindow.valkey.host | quote }}{{ end }}
            - name: DECISION_ENGINE_VALKEY_PORT
              value: {{ .Values.factWindow.valkey.port | quote }}
            {{- if or .Values.factWindow.valkey.credentialsSecret .Values.valkey.enabled }}
            - name: DECISION_ENGINE_VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.valkey.enabled }}{{ printf "%s-valkey" .Release.Name }}{{ else }}{{ .Values.factWindow.valkey.credentialsSecret }}{{ end }}
                  key: {{ if .Values.valkey.enabled }}valkey-password{{ else }}password{{ end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            grpc:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
