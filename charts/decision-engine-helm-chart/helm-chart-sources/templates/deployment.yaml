apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "decision-engine.fullname" . }}
  labels:
    {{- include "decision-engine.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "decision-engine.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "decision-engine.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "decision-engine.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- if and .Values.cloudSqlProxy.enabled .Values.postgresql.enabled }}
      {{- fail "cloudSqlProxy.enabled and postgresql.enabled are mutually exclusive: the proxy fronts an external Cloud SQL instance, not the embedded PostgreSQL" }}
      {{- end }}
      {{- if or .Values.cloudSqlProxy.enabled .Values.migration.enabled .Values.postgresql.enabled }}
      initContainers:
        {{- if .Values.cloudSqlProxy.enabled }}
        {{- include "decision-engine.cloudSqlProxySidecar" . | nindent 8 }}
        {{- end }}
        {{- if or .Values.migration.enabled .Values.postgresql.enabled }}
        - name: database-migration
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}{{- if .Values.migration.image.digest }}@{{ .Values.migration.image.digest }}{{- end }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: DECISION_ENGINE_TENANTS
              value: {{ required "migration.tenants is required when the migration init container is enabled" .Values.migration.tenants | quote }}
            - name: DECISION_ENGINE_CONTROL_PLANE_DATABASE_URL
              value: {{ if .Values.postgresql.enabled }}{{ printf "jdbc:postgresql://%s-postgresql:5432/%s" .Release.Name .Values.postgresql.auth.database | quote }}{{ else }}{{ .Values.database.url | quote }}{{ end }}
            {{- if .Values.postgresql.enabled }}
            - name: DECISION_ENGINE_ADMIN_DATABASE_USERNAME
              value: {{ .Values.migration.administratorUsername | quote }}
            - name: DECISION_ENGINE_ADMIN_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgresql" .Release.Name }}
                  key: {{ .Values.migration.administratorPasswordKey }}
            - name: DECISION_ENGINE_RUNTIME_DATABASE_USERNAME
              value: {{ .Values.database.runtimeUsername | quote }}
            - name: DECISION_ENGINE_RUNTIME_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgresql" .Release.Name }}
                  key: {{ .Values.migration.runtimeDatabasePasswordKey }}
            {{- else }}
            - name: DECISION_ENGINE_ADMIN_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.adminCredentialsSecret }}
                  key: username
            - name: DECISION_ENGINE_ADMIN_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.adminCredentialsSecret }}
                  key: password
            - name: DECISION_ENGINE_RUNTIME_DATABASE_USERNAME
              value: {{ .Values.database.runtimeUsername | quote }}
            - name: DECISION_ENGINE_RUNTIME_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.credentialsSecret }}
                  key: password
            {{- end }}
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
        {{- end }}
      {{- end }}
      containers:
        - name: decision-engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
          env:
            - name: DECISION_ENGINE_GRPC_PORT
              value: {{ .Values.service.grpcPort | quote }}
            - name: DECISION_ENGINE_CONTROL_PLANE_DATABASE_URL
              value: {{ if .Values.postgresql.enabled }}{{ printf "jdbc:postgresql://%s-postgresql:5432/%s" .Release.Name .Values.postgresql.auth.database | quote }}{{ else }}{{ .Values.database.url | quote }}{{ end }}
            # forwardmeasure.jpa.tenant-database.host/port (the per-tenant Postgres routing config
            # ForwardMeasureJpa{Quarkus,Spring,Micronaut}'s TenantDataSourceRegistry bean requires,
            # with no default anywhere - found 2026-09-17) - DECISION_ENGINE_CONTROL_PLANE_DATABASE_URL above
            # carries a full JDBC URL, but the tenant-database resolver needs host/port broken out
            # separately to build one JDBC URL per tenant database. Derived from the same source
            # (the embedded-postgresql Service name, or a regex split of the external URL) so it can
            # never drift from the real connection target.
            - name: DECISION_ENGINE_TENANT_DATABASE_HOST
              value: {{ if .Values.postgresql.enabled }}{{ printf "%s-postgresql" .Release.Name | quote }}{{ else }}{{ regexReplaceAll "^jdbc:postgresql://([^:/]+)(:([0-9]+))?/.*$" .Values.database.url "${1}" | quote }}{{ end }}
            - name: DECISION_ENGINE_TENANT_DATABASE_PORT
              value: {{ if .Values.postgresql.enabled }}"5432"{{ else }}{{ regexReplaceAll "^jdbc:postgresql://([^:/]+)(:([0-9]+))?/.*$" .Values.database.url "${3}" | default "5432" | quote }}{{ end }}
            - name: DECISION_ENGINE_RUNTIME_DATABASE_USERNAME
              {{- if .Values.postgresql.enabled }}
              value: {{ .Values.database.runtimeUsername | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.credentialsSecret }}
                  key: username
              {{- end }}
            - name: DECISION_ENGINE_RUNTIME_DATABASE_PASSWORD
              {{- if .Values.postgresql.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgresql" .Release.Name }}
                  key: {{ .Values.migration.runtimeDatabasePasswordKey }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.credentialsSecret }}
                  key: password
              {{- end }}
            - name: DECISION_ENGINE_VALKEY_HOST
              value: {{ if .Values.valkey.enabled }}{{ printf "%s-valkey-primary" .Release.Name | quote }}{{ else }}{{ .Values.factWindow.valkey.host | quote }}{{ end }}
            - name: DECISION_ENGINE_VALKEY_PORT
              value: {{ .Values.factWindow.valkey.port | quote }}
            {{- if or .Values.factWindow.valkey.credentialsSecret .Values.valkey.enabled }}
            - name: DECISION_ENGINE_VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.valkey.enabled }}{{ printf "%s-valkey" .Release.Name }}{{ else }}{{ .Values.factWindow.valkey.credentialsSecret }}{{ end }}
                  key: {{ if .Values.valkey.enabled }}valkey-password{{ else }}password{{ end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            grpc:
              port: {{ .Values.service.grpcPort }}
              service: liveness
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            grpc:
              port: {{ .Values.service.grpcPort }}
              service: readiness
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            grpc:
              port: {{ .Values.service.grpcPort }}
              service: liveness
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: temporary-files
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
