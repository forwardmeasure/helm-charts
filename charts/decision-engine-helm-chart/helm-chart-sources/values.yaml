# ---------------------------------------------------------------------------
# values.yaml — Decision Engine Helm chart defaults
#
# One chart, parameterized by which framework binding's image it runs. PostgreSQL and Valkey are
# optional Bitnami dependencies; when PostgreSQL is managed here (or migration.enabled is set), the
# application pod runs the migration image as an init container before the gRPC server starts.
# ---------------------------------------------------------------------------

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: docker.io/forwardmeasure/decision-engine-quarkus
  tag: "1.1.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: docker-io-credentials

service:
  type: ClusterIP
  # Matches Quarkus's own gRPC default. No established convention to follow here otherwise - see
  # IMPLEMENTATION-SPEC.md Section 9.1.
  grpcPort: 9000

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 768Mi

# ---------------------------------------------------------------------------
# Ruleset-definition database (Postgres) - decision-engine-jpa, Section 7.3. Runtime credential
# only; the administrator credential belongs to decision-engine-database-migration-service's own
# Job, run separately (see deploy/helmfile).
# ---------------------------------------------------------------------------
database:
  url: ""
  credentialsSecret: decision-engine-database-credentials
  adminCredentialsSecret: ""
  runtimeUsername: decision_engine_runtime

# ---------------------------------------------------------------------------
# Cloud SQL Auth Proxy - same values contract as java-microservice-helm-chart's cloudSqlProxy
# (secretName/existingSecretName/instanceKey/port/privateIp/resources), so every product in the
# cluster configures it the same way. Listens on localhost:<port>; point database.url at
# jdbc:postgresql://localhost:<port>/<db>. Rendered as a native sidecar so it is up before the
# optional database-migration init container and the server start. Authenticates via Workload
# Identity - the pod's ServiceAccount (serviceAccount.annotations) must map to a GSA holding
# roles/cloudsql.client.
#
# The instance connection name is deliberately Secret-key-only, matching java-microservice-helm-
# chart: existingSecretName names a Secret verbatim; otherwise secretName resolves to
# <release>-<secretName>. image.repository includes the registry, matching image: above.
# ---------------------------------------------------------------------------
cloudSqlProxy:
  enabled: false
  existingSecretName: ""
  secretName: cloudsql
  instanceKey: db-cloud-sql-instance
  image:
    repository: gcr.io/cloud-sql-connectors/cloud-sql-proxy
    tag: "2.25.3"
    digest: "sha256:821e5050a77697269399cadcaf5fa55322411dd1922020ea9729fd4ad174810a"
    pullPolicy: IfNotPresent
  port: 5432
  privateIp: true
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ---------------------------------------------------------------------------
# Fact-window store (Valkey) - decision-engine-fact-window, Section 7.4. See Section 9.1/9.2 for
# how the "embedded" vs "external" mode is actually resolved at the helmfile layer - this chart
# itself only ever sees a plain host:port, never anything about how that Valkey came to exist.
# ---------------------------------------------------------------------------
factWindow:
  valkey:
    host: ""
    port: 6379
    credentialsSecret: ""

# Set these to true for a self-contained development or single-cluster installation. Leave them
# false when the platform supplies PostgreSQL and Valkey and set the external connection values
# above instead.
postgresql:
  enabled: false
  architecture: standalone
  auth:
    username: decision_engine_runtime
    database: decision_engine
    postgresPassword: ""
    password: ""
  primary:
    persistence:
      enabled: true

valkey:
  enabled: false
  architecture: standalone
  auth:
    enabled: true
    password: ""

migration:
  # Existing platform tenant aliases; never create a second independent tenant registry.
  tenants: ""
  # Automatically active when postgresql.enabled=true. Set true explicitly for an external
  # database when adminCredentialsSecret and database.url are supplied.
  enabled: false
  image:
    repository: docker.io/forwardmeasure/decision-engine-database-migration-service
    tag: "1.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  runtimeDatabasePasswordKey: password
  administratorUsername: postgres
  administratorPasswordKey: postgres-password

podAnnotations: {}
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
