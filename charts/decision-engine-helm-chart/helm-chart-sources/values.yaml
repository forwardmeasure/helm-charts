# ---------------------------------------------------------------------------
# values.yaml — Decision Engine Helm chart defaults
#
# One chart, parameterized by which framework binding's image it runs. PostgreSQL and Valkey are
# optional Bitnami dependencies; when PostgreSQL is managed here, the application pod runs the
# migration image as an init container before the gRPC server starts.
# ---------------------------------------------------------------------------

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: docker.io/forwardmeasure/decision-engine-quarkus
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: docker-io-credentials

service:
  type: ClusterIP
  # Matches Quarkus's own gRPC default. No established convention to follow here otherwise - see
  # IMPLEMENTATION-SPEC.md Section 9.1.
  grpcPort: 9000

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 768Mi

# ---------------------------------------------------------------------------
# Ruleset-definition database (Postgres) - decision-engine-jpa, Section 7.3. Runtime credential
# only; the administrator credential belongs to decision-engine-database-migration-service's own
# Job, run separately (see deploy/helmfile).
# ---------------------------------------------------------------------------
database:
  url: ""
  credentialsSecret: decision-engine-database-credentials
  adminCredentialsSecret: ""
  runtimeUsername: decision_engine_runtime

# ---------------------------------------------------------------------------
# Fact-window store (Valkey) - decision-engine-fact-window, Section 7.4. See Section 9.1/9.2 for
# how the "embedded" vs "external" mode is actually resolved at the helmfile layer - this chart
# itself only ever sees a plain host:port, never anything about how that Valkey came to exist.
# ---------------------------------------------------------------------------
factWindow:
  valkey:
    host: ""
    port: 6379
    credentialsSecret: ""

# Set these to true for a self-contained development or single-cluster installation. Leave them
# false when the platform supplies PostgreSQL and Valkey and set the external connection values
# above instead.
postgresql:
  enabled: false
  architecture: standalone
  auth:
    username: decision_engine_runtime
    database: decision_engine
    postgresPassword: ""
    password: ""
  primary:
    persistence:
      enabled: true

valkey:
  enabled: false
  architecture: standalone
  auth:
    enabled: true
    password: ""

migration:
  # Automatically active when postgresql.enabled=true. Set true explicitly for an external
  # database when adminCredentialsSecret and database.url are supplied.
  enabled: false
  image:
    repository: docker.io/forwardmeasure/decision-engine-database-migration-service
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  runtimeDatabasePasswordKey: password
  administratorUsername: postgres
  administratorPasswordKey: postgres-password

podAnnotations: {}
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
