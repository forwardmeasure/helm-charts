# ==============================================================================
# java-microservice chart — default values
# ==============================================================================

nameOverride: ""
fullnameOverride: ""

# Pod annotations applied to all pods in this release.
podAnnotations:
  traffic.sidecar.istio.io/excludeInboundPorts: "8080"

# ------------------------------------------------------------------------------
# Image pull secrets
# ------------------------------------------------------------------------------
imagePullSecrets:
  - name: docker-io-credentials

# ------------------------------------------------------------------------------
# ServiceAccount
# create: true  — chart creates its own SA
# create: false — use a pre-existing SA; name must still be set
# annotations:  empty by default; GCP Workload Identity applied via overlay:
#   iam.gke.io/gcp-service-account: <gsa>@<project>.iam.gserviceaccount.com
# ------------------------------------------------------------------------------
serviceAccount:
  create: true
  name: java-microservice-serving-sa
  labels: {}
  annotations: {}

# ------------------------------------------------------------------------------
# Generic per-release RBAC — off by default.
# create: true renders a Role + RoleBinding scoped to serviceAccount.name,
# granting exactly the rules supplied below. Use for a release whose own
# application logic needs Kubernetes API access beyond what
# spark-rbac.yaml/launcher-job-rbac.yaml's narrow, feature-specific grants
# already cover (e.g. a Job that reconciles tenant namespaces).
#
# rbac:
#   create: true
#   name: my-release-role   # defaults to "<release-name>-role"
#   rules:
#     - apiGroups: [""]
#       resources: ["configmaps"]
#       verbs: ["get", "list", "watch"]
# ------------------------------------------------------------------------------
rbac:
  create: false
  rules: []

# ------------------------------------------------------------------------------
# Chart-level pod/container securityContext defaults — empty (unset) by
# default, matching today's behavior of never rendering a securityContext at
# all. Both are deep-mergeable at the service level (services.<name>.
# securityContext / services.<name>.podSecurityContext), with service-level
# keys overriding matching chart-level keys.
#
# podSecurityContext applies to spec.template.spec.securityContext (the Pod).
# securityContext applies to the main application container only.
#
# Not wired into deploymentMode: knative's terminationGracePeriodSeconds -
# Knative Serving's PodSpec admission webhook whitelists a narrower,
# feature-flag-gated set of fields than plain Deployment/Job pods, and none
# of this chart's knative-mode consumers need it.
# ------------------------------------------------------------------------------
podSecurityContext: {}
securityContext: {}

# automountServiceAccountToken / terminationGracePeriodSeconds: unset by
# default, leaving Kubernetes' own implicit defaults in effect (true / 30s) -
# exactly today's behavior, where neither field is ever rendered. Settable at
# chart level here or overridden per service
# (services.<name>.automountServiceAccountToken /
# services.<name>.terminationGracePeriodSeconds).
# automountServiceAccountToken: false
# terminationGracePeriodSeconds: 60

# ------------------------------------------------------------------------------
# External Secrets Operator — chart-level defaults
# Applied to all ExternalSecrets unless overridden.
# ------------------------------------------------------------------------------
externalSecret:
  clusterSecretStore: fake-secret-store
  refreshInterval: 1h

# ------------------------------------------------------------------------------
# Release-level shared secrets
# Produces one ExternalSecret per entry, named <release>-<secretName>.
# Use for secrets shared across multiple services in this release
# (e.g. shared DB credentials, shared OIDC config).
#
# Format:
#   secrets:
#     - secretName: db
#       entries:
#         - secretKey: db-username
#           remoteKey: /my-release/db/username
#         - secretKey: db-password
#           remoteKey: /my-release/db/password
#     - secretName: oidc
#       entries:
#         - secretKey: oidc-auth-server-url
#           remoteKey: /my-api/oidc/auth-server-url
#
# Services reference these via secretName in their secrets list — the chart
# resolves the Kubernetes secret name as <release>-<secretName>.
# ------------------------------------------------------------------------------
secrets: []

# ------------------------------------------------------------------------------
# Cloud SQL Auth Proxy sidecar — chart-level defaults
# Applied to all services with cloudSqlProxy.enabled: true.
# Proxy listens on localhost:<port>, handles IAM auth via Workload Identity.
# App connects to localhost:<port> with standard PostgreSQL JDBC.
# privateIp: true — required when Cloud SQL instance has no public IP.
# ------------------------------------------------------------------------------
cloudSqlProxy:
  image:
    registry: gcr.io
    repository: cloud-sql-connectors/cloud-sql-proxy
    tag: "2.14.1"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  port: 5432
  privateIp: true

# ------------------------------------------------------------------------------
# Liquibase migration wait — chart-level defaults
# Rendered as an init container on every enabled service unless the service
# sets liquibaseWait.enabled: false (e.g. the liquibase service itself).
# Polls GET /migration/schemas/public/ready — 200 = ready, 503 = migrating.
# ------------------------------------------------------------------------------
liquibaseWait:
  enabled: true
  image: curlimages/curl:latest
  imagePullPolicy: IfNotPresent
  serviceName: liquibase-migration
  serviceNamespace: data-fabric
  maxAttempts: 30
  sleepSeconds: 10
  resources:
    requests:
      cpu: "50m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"

# ------------------------------------------------------------------------------
# Kafka topic provisioning via Strimzi KafkaTopic CRD.
#
# namespace:    Kubernetes namespace where KafkaTopic resources are created.
#               Must match the namespace of the Strimzi operator and Kafka
#               cluster — typically "kafka".
#
# clusterName:  Value of the strimzi.io/cluster label. Must match the
#               metadata.name of the Kafka custom resource in the cluster.
#               Run: kubectl get kafka -A to find the correct name.
#
# topicPrefix:  Prepended to every topic suffix to form the full topic name.
#               Format: <topicPrefix>.<topic.suffix>
#               Should match the naming convention used across the platform
#               and must match what is provisioned in Strimzi per environment.
#               Example: com.forwardmeasure.entity-resolution
#
# defaults:     Chart-level defaults applied to all topics unless overridden
#               per-topic. Any field can be overridden at the topic level.
#
# topics:       List of KafkaTopic resources to provision. Each entry produces
#               one KafkaTopic in the Kafka namespace.
#
# Topic entry fields:
#   suffix:            Required. Appended to topicPrefix to form the topic name.
#                      Example: ingest-evidence
#                      Results in: com.forwardmeasure.entity-resolution.ingest-evidence
#   description:       Optional. Human-readable comment rendered in the manifest.
#   partitions:        Number of partitions. Default: kafka.defaults.partitions.
#   replicas:          Replication factor. Default: kafka.defaults.replicas.
#   retentionMs:       Message retention in milliseconds. Default: 7 days (604800000).
#   cleanupPolicy:     delete or compact. Default: delete.
#   compressionType:   none, gzip, snappy, lz4, zstd, producer. Default: lz4.
#   minInsyncReplicas: Minimum in-sync replicas for writes. Default: 2.
#   maxMessageBytes:   Maximum message size in bytes. Omitted if not set.
#   retentionBytes:    Maximum size in bytes per partition before oldest segments
#                      are deleted. Omitted if not set. Recommended for high-volume
#                      pass-through topics to enforce a hard disk cap independent
#                      of retention time.
#   segmentMs:         Time after which an active log segment is rolled.
#                      Omitted if not set.
# ------------------------------------------------------------------------------
kafka:
  namespace: kafka
  clusterName: kafka-cluster
  topicPrefix: com.forwardmeasure.entity-resolution

  defaults:
    partitions: 12
    replicas: 3
    retentionMs: "604800000" # 7 days
    cleanupPolicy: delete
    compressionType: lz4
    minInsyncReplicas: 2

  topics: []
  # Example:
  #   - suffix: ingest-evidence
  #     description: >
  #       Durable ingestion commands. Produced by EvidenceIngestionPipelineSupport,
  #       consumed by DurableEvidenceIngestionRoute.
  #     partitions: 12
  #     replicas: 3
  #     retentionMs: "604800000"
  #     minInsyncReplicas: 2
  #
  #   - suffix: extraction.dlq
  #     description: >
  #       Dead-letter queue for failed extraction pipeline messages.
  #     partitions: 3
  #     replicas: 3
  #     retentionMs: "2592000000"   # 30 days

# ------------------------------------------------------------------------------
# Services
# Each map entry produces a Kubernetes workload for one service in this release.
# The key is the authoritative service name. A map is used deliberately so
# later environment values files can deep-merge one service without replacing
# the other services in the release.
#
# framework: quarkus | spring | micronaut (default: quarkus)
#   Selects the framework-conventional default health-probe paths
#   (probes.liveness/.readiness/.startup below, when a service doesn't set
#   its own) and, when database.enabled: true is used, the framework-
#   conventional datasource credential environment variable names. Both stay
#   fully overridable per service regardless of framework - this only
#   changes the *default*.
#
# services:
#   example-api:
#     enabled: true
#     deploymentMode: deployment
#     framework: quarkus
#     image:
#       repository: example/example-api
#       tag: latest
#     env:
#       EXAMPLE_SETTING: value
#     initContainers:
#       - enabled: true
#         name: prepare-service
#         image: example/preparer:latest
#         env:
#           PREPARE_MODE: strict
#         secrets:
#           - envVar: PREPARE_TOKEN
#             existingSecretName: example-preparer
#             secretKey: token
#         script: exec /deployments/prepare
#         resources:
#           requests:
#             cpu: 50m
#             memory: 64Mi
#           limits:
#             cpu: 250m
#             memory: 256Mi
#
# Per-service secrets (unique to that service) are declared under secrets[].
# Shared secrets across services are declared at the top-level secrets[] above.
#
# Read-only Secret volumes are generic and opt-in:
#   secretVolumeMounts:
#     - name: service-credentials
#       secretName: existing-kubernetes-secret
#       mountPath: /var/run/secrets/my-service
#       readOnly: true
#       optional: false
#       defaultMode: 0400
#       items:
#         - key: client-id
#           path: client-id
#         - key: client-secret
#           path: client-secret
#
# Read-only ConfigMap-as-file volumes are the sibling of secretVolumeMounts
# above — same shape, mounting an existing ConfigMap instead of a Secret.
# Use for e.g. an executable bootstrap script baked into a ConfigMap:
#   configMapVolumeMounts:
#     - name: bootstrap-script
#       configMapName: existing-configmap
#       mountPath: /opt/bootstrap
#       readOnly: true
#       optional: false
#       defaultMode: 0755
#       items:
#         - key: bootstrap.sh
#           path: bootstrap.sh
#           mode: 0755
#
# Extra container ports, alongside the always-present http1 port (named
# "http1", from `port` below). Each entry also gets its own port on the
# ClusterIP Service that deploymentMode: deployment/job render (service.yaml)
# — targetPort defaults to containerPort; servicePort defaults to the same
# value if you need the Service-facing port number to differ. Only valid for
# deploymentMode: deployment or job — Knative Serving permits exactly one
# container port and deploymentMode: knative will fail validation if
# extraPorts is set. Needed for e.g. Pekko cluster remoting/management ports
# alongside a service's normal HTTP port.
#   extraPorts:
#     - name: pekko-remote
#       containerPort: 25520
#     - name: pekko-mgmt
#       containerPort: 8558
#       servicePort: 8558
#
# Helm hook annotations — unset by default, so no annotations are rendered
# (identical to today for every existing release). When set, renders
# helm.sh/hook / helm.sh/hook-weight / helm.sh/hook-delete-policy onto
# whichever resource this service's deploymentMode produces (Deployment,
# Knative Service, ScaledJob, or Job). `events` uses Helm's own hook-event
# vocabulary verbatim: pre-install, post-install, pre-upgrade, post-upgrade,
# pre-delete, post-delete, pre-rollback, post-rollback, test. Typical use:
# a deploymentMode: job release that must run once before/after install.
#   hooks:
#     events: ["pre-install", "pre-upgrade"]
#     weight: "10"
#     deletePolicy: "before-hook-creation,hook-succeeded"
#
# deploymentMode: knative (default) | deployment | scaledJob | job
#   knative    — Knative Service with scale-to-zero and Knative traffic
#                management. Use for pure HTTP request/response workloads.
#   deployment — Standard Kubernetes Deployment + ClusterIP Service.
#                Use for services requiring stable long-lived connections
#                (Spark driver, persistent Kafka consumers, etc.).
#                Optional strategy maps directly to Deployment.spec.strategy.
#                Kafka Streams applications whose topology may change should
#                use strategy.type: Recreate so incompatible topology
#                generations never share one application.id.
#   scaledJob  — KEDA ScaledJob for queue-triggered finite workers that
#                process one unit of work and exit.
#   job        — Plain batch/v1 Job for a single run-once workload, typically
#                driven by the `hooks` block above (e.g. a Helm pre-install
#                hook that bootstraps a tenant or runs a one-off migration).
#                Distinct from scaledJob: no KEDA, no scaling.triggers, not
#                autoscaled or re-triggered — it runs exactly once per Helm
#                operation that fires its hook (or once at apply time with no
#                hooks set). Cloud SQL proxy (if enabled) renders as a native
#                sidecar (like scaledJob), not a persistent sidecar, so the
#                Job can actually reach completion.
#                job.parallelism/.completions/.backoffLimit/
#                .activeDeadlineSeconds/.ttlSecondsAfterFinished/
#                .restartPolicy — same meaning as scaledJob's job.* fields
#                below (job.restartPolicy defaults to "Never").
#
# scaling fields:
#
#   Both modes:
#     minReplicas:   Minimum replicas for the selected autoscaler.
#     maxReplicas:   Maximum replicas for the selected autoscaler.
#
#   knative only:
#     target:               Concurrency target per pod.
#     timeoutSeconds:       Request timeout in seconds.
#     containerConcurrency: Max concurrent requests per pod (0 = unlimited).
#     class:                Autoscaler class (default: kpa.autoscaling.knative.dev).
#     metric:               Autoscaler metric (default: concurrency).
#
#   deployment only:
#     strategy:
#       type: Recreate  # or RollingUpdate with rollingUpdate settings
#     autoscaler:     none | hpa | keda. Default: none.
#                     none — Deployment only.
#                     hpa  — Deployment + Kubernetes HorizontalPodAutoscaler.
#                     keda — Deployment + KEDA ScaledObject.
#     initialReplicas: Initial Deployment.spec.replicas value. Defaults to
#                      minReplicas, then 1. Set to 0 with KEDA scale-to-zero.
#
#   scaledJob only:
#     minReplicas:                 Minimum running jobs. Usually 0.
#     maxReplicas:                 Maximum concurrent jobs.
#     successfulJobsHistoryLimit:  Completed Job history to retain.
#     failedJobsHistoryLimit:      Failed Job history to retain.
#     job.parallelism:             Kubernetes Job parallelism. Default: 1.
#     job.completions:             Kubernetes Job completions. Default: 1.
#     job.backoffLimit:            Kubernetes Job retry count. Default: 0,
#                                  because durable task retry is owned by
#                                  the application task state machine.
#     job.activeDeadlineSeconds:   Optional wall-clock limit for one Job.
#     job.ttlSecondsAfterFinished: Optional cleanup TTL for finished Jobs.
#
# Spark executor pod template:
#     spark.executorPodTemplate.enabled: true renders a ConfigMap containing a
#     Spark Kubernetes executor pod template and mounts it into the service pod.
#     Use this for Spark client-mode drivers whose executor pods need the same
#     sidecars or pod-level wiring as the driver, for example a Cloud SQL proxy.
#
#     spark:
#       executorPodTemplate:
#         enabled: true
#         mountPath: /deployments/spark
#         fileName: executor-pod-template-cloudsql.yaml
#         executorContainerName: spark-kubernetes-executor
#         executorImage: docker.io/forwardmeasure/entity-intelligence-spark-common:latest
#         cloudSqlProxy:
#           enabled: true
#
#   deployment + autoscaler: hpa:
#     cpuTarget:                      CPU utilisation % to trigger scale-up.
#                                     Default: 70. Omit to disable CPU scaling.
#     memoryTarget:                   Memory utilisation % to trigger scale-up.
#                                     Omit to disable memory scaling.
#     scaleDownStabilizationSeconds:  HPA scale-down stabilisation window.
#                                     Default: 300.
#     scaleUpStabilizationSeconds:    HPA scale-up stabilisation window.
#                                     Default: 30.
#
#   deployment + autoscaler: keda, and scaledJob:
#     pollingInterval: How often KEDA polls scalers for metrics (seconds).
#                      Default: 15.
#     cooldownPeriod:  Seconds to wait after last active trigger before
#                      scaling down to minReplicas. Default: 300.
#     triggers:        List of KEDA trigger definitions. Each entry maps
#                      directly to a ScaledObject trigger block.
#     type:            Scaler type (e.g. kafka, prometheus, cpu).
#     metadata:        Key-value map passed verbatim to the scaler.
#                      All values are quoted strings.
#
#   Kafka trigger example:
#     scaling:
#       autoscaler: keda
#       initialReplicas: 0
#       minReplicas: 0
#       maxReplicas: 8
#       pollingInterval: 15
#       cooldownPeriod: 300
#       triggers:
#         - type: kafka
#           metadata:
#             bootstrapServers: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
#             consumerGroup: "entity-intelligence-screening"
#             topic: "com.forwardmeasure.entity-intelligence.monitored-population.single-entity-screening.request"
#             lagThreshold: "100"
#             offsetResetPolicy: "latest"
#
#   Provider-neutral database contract:
#     database.enabled: true injects the current service's framework-
#     conventional datasource credential environment variables (see
#     framework: above - QUARKUS_DATASOURCE_*, SPRING_DATASOURCE_*, or
#     DATASOURCES_DEFAULT_* for Micronaut's default datasource) without
#     coupling the service values to a database provider. Without a Cloud SQL
#     proxy, the secret supplies db-username, db-password, and db-jdbc-url.
#     When cloudSqlProxy.enabled is true, the secret instead supplies db-name
#     and the chart builds the localhost JDBC URL. Key names are configurable.
#
#     database:
#       enabled: true
#       secretName: db
#       usernameKey: db-username
#       passwordKey: db-password
#       jdbcUrlKey: db-jdbc-url
#       databaseNameKey: db-name
#
#     Cloud SQL instanceConnectionName is deliberately still Secret-key-only
#     (cloudSqlProxy.instanceKey, default "db-cloud-sql-instance") — this
#     chart does not support it as a plain, non-Secret value. A consumer that
#     only has it as a plain string (not already in a Secret) should put it
#     in a Secret at that key; existingSecretName/secretName/instanceKey are
#     already fully configurable per service, so no chart change is needed
#     either way. Chosen over adding plain-value support because the
#     instance connection name is duplicated across three template call
#     sites (deployment/knative sidecar, scaledJob/job native sidecar, and
#     the Spark executor pod template's own copy) — a second source-of-truth
#     input there would need to be threaded through and kept in sync across
#     all three, for a value that costs nothing to put in a Secret already.
#
# Per-service securityContext / podSecurityContext / automountServiceAccountToken /
# terminationGracePeriodSeconds override the chart-level defaults of the same
# name (see top of this file) — same semantics, just scoped to one service.
#   services:
#     my-worker:
#       securityContext:
#         runAsNonRoot: true
#         allowPrivilegeEscalation: false
#       podSecurityContext:
#         fsGroup: 1000
#       automountServiceAccountToken: false
#       terminationGracePeriodSeconds: 60
# ------------------------------------------------------------------------------
services: {}
