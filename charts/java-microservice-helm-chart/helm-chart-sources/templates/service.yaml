{{- range (include "java-microservice.normalizedServices" . | fromYamlArray) }}
{{- if and .enabled (eq (.deploymentMode | default "knative") "deployment") }}
{{- $svcCfg := .service | default (dict) }}
{{- if and $svcCfg.clusterIP (ne $svcCfg.clusterIP "None") }}
{{- fail (printf "service '%s' has service.clusterIP '%s'; only \"None\" (headless Service) is supported" .name $svcCfg.clusterIP) }}
{{- end }}
---
# ---------------------------------------------------------------------------
# Service: {{ .name }}
# ClusterIP Service exposing the HTTP port for Istio, other services,
# and health check endpoints. Knative creates this automatically — for
# standard Deployments it must be declared explicitly.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "java-microservice.serviceLabels" (dict "service" . "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  {{- if eq ($svcCfg.clusterIP | default "") "None" }}
  clusterIP: None
  {{- end }}
  selector:
    app.kubernetes.io/component: {{ .name }}
    java-microservice/family: {{ $.Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .port | default 8080 }}
      protocol: TCP
    {{- range .extraPorts }}
    - name: {{ required "extraPorts[].name is required" .name }}
      port: {{ .servicePort | default .containerPort }}
      targetPort: {{ required "extraPorts[].containerPort is required" .containerPort }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
{{- end }}
{{- end }}
