{{- range (include "java-microservice.normalizedServices" . | fromYamlArray) }}
{{- if and .enabled (eq (.deploymentMode | default "knative") "deployment") }}
{{- include "java-microservice.validateService" (dict "service" . "root" $) }}
{{- $scaling := .scaling | default (dict) }}
{{- $minReplicas := 1 }}
{{- if hasKey $scaling "initialReplicas" }}
{{- $minReplicas = $scaling.initialReplicas }}
{{- else if hasKey $scaling "minReplicas" }}
{{- $minReplicas = $scaling.minReplicas }}
{{- end }}
---
# ---------------------------------------------------------------------------
# Deployment: {{ .name }}
# Standard Kubernetes Deployment.
# Autoscaling is selected explicitly with scaling.autoscaler:
# none | hpa | keda.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "java-microservice.serviceLabels" (dict "service" . "root" $) | nindent 4 }}
  {{- $hookAnnotations := include "java-microservice.hookAnnotations" (dict "service" . "root" $) }}
  {{- if $hookAnnotations }}
  annotations:
    {{- $hookAnnotations | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $minReplicas }}
  {{- with .strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .name }}
      java-microservice/family: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        {{- include "java-microservice.serviceLabels" (dict "service" . "root" $) | nindent 8 }}
      {{- $podAnnotations := include "java-microservice.podAnnotations" (dict "service" . "root" $) }}
      {{- if $podAnnotations }}
      annotations:
        {{- $podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      {{- $automount := include "java-microservice.automountServiceAccountToken" (dict "service" . "root" $) }}
      {{- if $automount }}
      automountServiceAccountToken: {{ $automount }}
      {{- end }}
      {{- $termGrace := include "java-microservice.terminationGracePeriodSeconds" (dict "service" . "root" $) }}
      {{- if $termGrace }}
      terminationGracePeriodSeconds: {{ $termGrace }}
      {{- end }}
      {{- $podSecurityContext := include "java-microservice.podSecurityContext" (dict "service" . "root" $) }}
      {{- if $podSecurityContext }}
      securityContext:
        {{- $podSecurityContext | nindent 8 }}
      {{- end }}
      {{- $podAntiAffinity := include "java-microservice.podAntiAffinity" (dict "service" . "root" $) }}
      {{- if $podAntiAffinity }}
      affinity:
        {{- $podAntiAffinity | nindent 8 }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "java-microservice.podVolumes" (dict "service" . "root" $) | nindent 6 }}
      {{- include "java-microservice.initContainers" (dict "service" . "root" $) | nindent 6 }}
      containers:
        {{- include "java-microservice.mainContainer" (dict "service" . "root" $) | nindent 8 }}
        {{- include "java-microservice.cloudSqlProxySidecar" (dict "service" . "root" $) | nindent 8 }}
{{- end }}
{{- end }}
