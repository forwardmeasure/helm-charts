{{- range (include "java-microservice.normalizedServices" . | fromYamlArray) }}
{{- if and .enabled (eq (.deploymentMode | default "knative") "job") }}
{{- include "java-microservice.validateService" (dict "service" . "root" $) }}
---
# ---------------------------------------------------------------------------
# Job: {{ .name }}
# Plain one-shot Kubernetes Job (batch/v1) for hook-driven or run-once
# workloads (e.g. an install/upgrade Helm hook that bootstraps a tenant or
# runs a migration). Neither existing workload mode fits this need:
# deploymentMode: deployment only ever renders apps/v1 Deployment (a
# long-running, self-restarting workload, not a one-shot Job), and
# deploymentMode: scaledJob is KEDA-managed and requires scaling.triggers
# (a queue-driven autoscaled worker, not a hook-ordered one-off task).
# Attach Helm hook annotations via the optional `hooks` block (see
# _helpers.tpl java-microservice.hookAnnotations) to run this Job as a
# pre-install/pre-upgrade/etc. hook with a specific weight.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "java-microservice.serviceLabels" (dict "service" . "root" $) | nindent 4 }}
  {{- $hookAnnotations := include "java-microservice.hookAnnotations" (dict "service" . "root" $) }}
  {{- if $hookAnnotations }}
  annotations:
    {{- $hookAnnotations | nindent 4 }}
  {{- end }}
spec:
  {{- include "java-microservice.jobSpec" (dict "service" . "root" $) | nindent 2 }}
{{- end }}
{{- end }}
