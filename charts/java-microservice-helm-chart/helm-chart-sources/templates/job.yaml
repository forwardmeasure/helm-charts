{{- range (include "java-microservice.normalizedServices" . | fromYamlArray) }}
{{- if and .enabled (eq (.deploymentMode | default "knative") "job") }}
{{- include "java-microservice.validateService" (dict "service" . "root" $) }}
{{- $job := .job | default (dict) }}
---
# ---------------------------------------------------------------------------
# Job: {{ .name }}
# Plain one-shot Kubernetes Job (batch/v1) for hook-driven or run-once
# workloads (e.g. an install/upgrade Helm hook that bootstraps a tenant or
# runs a migration). Neither existing workload mode fits this need:
# deploymentMode: deployment only ever renders apps/v1 Deployment (a
# long-running, self-restarting workload, not a one-shot Job), and
# deploymentMode: scaledJob is KEDA-managed and requires scaling.triggers
# (a queue-driven autoscaled worker, not a hook-ordered one-off task).
# Attach Helm hook annotations via the optional `hooks` block (see
# _helpers.tpl java-microservice.hookAnnotations) to run this Job as a
# pre-install/pre-upgrade/etc. hook with a specific weight.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "java-microservice.serviceLabels" (dict "service" . "root" $) | nindent 4 }}
  {{- $hookAnnotations := include "java-microservice.hookAnnotations" (dict "service" . "root" $) }}
  {{- if $hookAnnotations }}
  annotations:
    {{- $hookAnnotations | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ $job.backoffLimit | default 0 }}
  completions: {{ $job.completions | default 1 }}
  parallelism: {{ $job.parallelism | default 1 }}
  {{- if hasKey $job "activeDeadlineSeconds" }}
  activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
  {{- end }}
  {{- if hasKey $job "ttlSecondsAfterFinished" }}
  ttlSecondsAfterFinished: {{ $job.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "java-microservice.serviceLabels" (dict "service" . "root" $) | nindent 8 }}
      {{- $podAnnotations := include "java-microservice.podAnnotations" (dict "service" . "root" $) }}
      {{- if $podAnnotations }}
      annotations:
        {{- $podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: {{ $job.restartPolicy | default "Never" }}
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      {{- $automount := include "java-microservice.automountServiceAccountToken" (dict "service" . "root" $) }}
      {{- if $automount }}
      automountServiceAccountToken: {{ $automount }}
      {{- end }}
      {{- $termGrace := include "java-microservice.terminationGracePeriodSeconds" (dict "service" . "root" $) }}
      {{- if $termGrace }}
      terminationGracePeriodSeconds: {{ $termGrace }}
      {{- end }}
      {{- $podSecurityContext := include "java-microservice.podSecurityContext" (dict "service" . "root" $) }}
      {{- if $podSecurityContext }}
      securityContext:
        {{- $podSecurityContext | nindent 8 }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "java-microservice.podVolumes" (dict "service" . "root" $) | nindent 6 }}
      {{- include "java-microservice.initContainers" (dict "service" . "root" $) | nindent 6 }}
      containers:
        {{- include "java-microservice.mainContainer" (dict "service" . "root" $) | nindent 8 }}
{{- end }}
{{- end }}
