apiVersion: v2
name: openworkflow-workflow-bundle
description: |
  A product's OpenWorkflow workflow bundle: its workflow documents (YAML) and its domain moniker,
  published into every listed tenant by forwardmeasure-openworkflow's workflow publisher image.
  Renders a ConfigMap of the documents and a post-install/post-upgrade hook Job that runs the
  publisher with them mounted, after uploading its API documents (apiDocuments) to the platform
  registry. Definitions name those documents by DID URL - "@BUNDLE_DID@/<file>", rendered to
  did:<didMethod>:bundle:<domain>/<file> - never by registry URL. Workflows are named
  <domain>-<document.name>; rerunning with unchanged documents publishes nothing. Products add one release of this chart to their own
  helmfile - no code, image or Keycloak clients of their own
  (forwardmeasure-openworkflow docs/workflow-lookup-and-publishing-handoff-2026-10-01.md §5.3).

  Install it in the namespace holding fowf's publisher identity Secret (identity.secretName).
type: application
version: "0.1.2"
appVersion: "1.1.0"
keywords:
  - openworkflow
  - workflow
maintainers:
  - name: Prashanth Nandavanam
    email: pn@forwardmeasure.com
