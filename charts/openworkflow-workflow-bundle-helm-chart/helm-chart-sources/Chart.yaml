apiVersion: v2
name: openworkflow-workflow-bundle
description: |
  A product's OpenWorkflow workflow bundle: its contract files and its workflow documents (YAML), in
  its workflow namespace. A release with contracts renders an upload Job that uploads every contract
  file to the platform registry, in the group its scope names; a release with definitions renders a
  publish Job that runs forwardmeasure-openworkflow's workflow publisher, which renders every bundle
  reference ("@BUNDLE_DID@/<file>" for this bundle, "@BUNDLE_DID:<alias>@/<file>" for a bundle
  contractBundles declares) to the DID URL of the registry version it names
  (did:<didMethod>:bundle:<workflowNamespace>/<file>?version=<n>), never a registry URL, and
  publishes each document into every listed tenant. Workflows are named
  <workflowNamespace>-<document.name>; rerunning with an unchanged rendered source publishes nothing.
  Products add a contracts release and a workflows release of this chart to their own helmfile - no
  code, image or Keycloak clients of their own (forwardmeasure-platform
  docs/contract-bundling-design-2026-11-11.md, sections 2.2, 2.3 and 2.15).

  Install it in the namespace holding fowf's publisher identity Secret (identity.secretName).
type: application
version: "0.3.0"
appVersion: "1.1.0"
keywords:
  - openworkflow
  - workflow
maintainers:
  - name: Prashanth Nandavanam
    email: pn@forwardmeasure.com
