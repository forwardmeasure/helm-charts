{{- include "openworkflow-workflow-bundle.validate" . }}
{{- if .Values.contracts }}
# Runs after every install/upgrade of a release with contracts: uploads every contract file to the
# platform's registry, in the group the bundle's scope names, before anything that names them is
# published. Identical content reuses its registry version, so a rerun with unchanged files uploads
# nothing new.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openworkflow-workflow-bundle.name" . }}-contracts
  labels:
    {{- include "openworkflow-workflow-bundle.plainLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Before the publish Job of the same release, when a release has both.
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "openworkflow-workflow-bundle.plainLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: upload
          image: {{ include "openworkflow-workflow-bundle.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - {name: OPENWORKFLOW_PUBLISHER_RUN, value: upload}
            - {name: OPENWORKFLOW_PUBLISHER_WORKFLOW_NAMESPACE, value: {{ .Values.workflowNamespace | quote }}}
            - {name: OPENWORKFLOW_PUBLISHER_REGISTRY_SCOPE, value: {{ .Values.scope | quote }}}
            - {name: OPENWORKFLOW_PUBLISHER_RESOURCES_DIR, value: /contracts}
            - {name: OPENWORKFLOW_PUBLISHER_REGISTRY_URL, value: {{ .Values.registry.apiUrl | quote }}}
            # Every uploaded version records its bundle's DID.
            - {name: FORWARDMEASURE_DID_METHOD, value: {{ .Values.didMethod | quote }}}
            {{- with include "openworkflow-workflow-bundle.contractRoles" . | fromJson }}
            # file name -> role: recorded on every version uploaded from the file.
            - {name: OPENWORKFLOW_PUBLISHER_CONTRACT_ROLES, value: {{ toJson . | quote }}}
            {{- end }}
            {{- with .Values.tenants }}
            # Scope tenant: each tenant's own registry group.
            - {name: OPENWORKFLOW_PUBLISHER_TENANTS, value: {{ join "," . | quote }}}
            {{- end }}
            - name: OPENWORKFLOW_PUBLISHER_DEFINITION_BASE_URL
              value: {{ required "fowf.definitionBaseUrl is required" .Values.fowf.definitionBaseUrl | quote }}
            - name: OPENWORKFLOW_PUBLISHER_KEYCLOAK_TOKEN_URL
              value: {{ required "fowf.keycloakTokenUrl is required" .Values.fowf.keycloakTokenUrl | quote }}
            {{- $secret := required "identity.secretName is required" .Values.identity.secretName }}
            - {name: OPENWORKFLOW_PUBLISHER_CLIENT_ID, valueFrom: {secretKeyRef: {name: {{ $secret | quote }}, key: {{ required "identity.clientIdKey is required" .Values.identity.clientIdKey | quote }}}}}
            - {name: OPENWORKFLOW_PUBLISHER_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: {{ $secret | quote }}, key: {{ required "identity.clientSecretKey is required" .Values.identity.clientSecretKey | quote }}}}}
          volumeMounts:
            - {name: contracts, mountPath: /contracts, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: contracts
          configMap: {name: {{ include "openworkflow-workflow-bundle.name" . }}-contracts}
        # The JVM writes its performance data here; the root filesystem is read-only.
        - {name: tmp, emptyDir: {}}
{{- end }}
