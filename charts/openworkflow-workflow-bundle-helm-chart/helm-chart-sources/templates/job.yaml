{{- include "openworkflow-workflow-bundle.validate" . }}
{{- if .Values.definitions }}
# Runs after every install/upgrade of a release with definitions: renders every bundle reference
# (@BUNDLE_DID@ and @BUNDLE_DID:<alias>@) to the DID URL of the registry version it names, then
# publishes the documents into every tenant. A rerun with an unchanged rendered source publishes
# nothing; a failure in one (tenant, workflow) doesn't stop the others, but fails the Job, and every
# refusal is logged with all its violations.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openworkflow-workflow-bundle.name" . }}
  labels:
    {{- include "openworkflow-workflow-bundle.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "openworkflow-workflow-bundle.labels" . | nindent 8 }}
      {{- with include "openworkflow-workflow-bundle.contractDigests" . | fromJson }}
      annotations:
        # alias -> contracts image digest of each bundle contractBundles names, and @self -> this
        # bundle's own when its definitions name them: new contracts change this Job, so the release
        # upgrades and the publisher pins their new versions.
        openworkflow.forwardmeasure.com/contract-digests: {{ toJson . | quote }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: publish
          image: {{ include "openworkflow-workflow-bundle.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - {name: OPENWORKFLOW_PUBLISHER_RUN, value: publish}
            - {name: OPENWORKFLOW_PUBLISHER_WORKFLOW_NAMESPACE, value: {{ .Values.workflowNamespace | quote }}}
            - {name: OPENWORKFLOW_PUBLISHER_REGISTRY_SCOPE, value: {{ .Values.scope | quote }}}
            - {name: OPENWORKFLOW_PUBLISHER_DEFINITIONS_DIR, value: /definitions}
            - {name: OPENWORKFLOW_PUBLISHER_TENANTS, value: {{ join "," .Values.tenants | quote }}}
            {{- with .Values.didMethod }}
            - {name: FORWARDMEASURE_DID_METHOD, value: {{ . | quote }}}
            {{- end }}
            # alias -> {workflowNamespace, scope}: the other bundles @BUNDLE_DID:<alias>@ names.
            - {name: OPENWORKFLOW_PUBLISHER_CONTRACT_BUNDLES, value: {{ toJson .Values.contractBundles | quote }}}
            {{- if include "openworkflow-workflow-bundle.namesContracts" . }}
            - {name: OPENWORKFLOW_PUBLISHER_REGISTRY_URL, value: {{ .Values.registry.apiUrl | quote }}}
            {{- end }}
            - name: OPENWORKFLOW_PUBLISHER_DEFINITION_BASE_URL
              value: {{ required "fowf.definitionBaseUrl is required" .Values.fowf.definitionBaseUrl | quote }}
            - name: OPENWORKFLOW_PUBLISHER_KEYCLOAK_TOKEN_URL
              value: {{ required "fowf.keycloakTokenUrl is required" .Values.fowf.keycloakTokenUrl | quote }}
            {{- $secret := required "identity.secretName is required" .Values.identity.secretName }}
            - {name: OPENWORKFLOW_PUBLISHER_CLIENT_ID, valueFrom: {secretKeyRef: {name: {{ $secret | quote }}, key: {{ required "identity.clientIdKey is required" .Values.identity.clientIdKey | quote }}}}}
            - {name: OPENWORKFLOW_PUBLISHER_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: {{ $secret | quote }}, key: {{ required "identity.clientSecretKey is required" .Values.identity.clientSecretKey | quote }}}}}
            {{- if .Values.reviewedCredentialCapabilities }}
            - {name: OPENWORKFLOW_PUBLISHER_REVIEWED_CREDENTIALS_FILE, value: /credential-scopes/reviewed-scopes.json}
            {{- $approverSecret := required "credentialApprover.secretName is required" .Values.credentialApprover.secretName }}
            - name: OPENWORKFLOW_PUBLISHER_APPROVER_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $approverSecret | quote }}
                  key: {{ required "credentialApprover.clientIdKey is required" .Values.credentialApprover.clientIdKey | quote }}
            - name: OPENWORKFLOW_PUBLISHER_APPROVER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $approverSecret | quote }}
                  key: {{ required "credentialApprover.clientSecretKey is required" .Values.credentialApprover.clientSecretKey | quote }}
            {{- end }}
          volumeMounts:
            {{- if .Values.reviewedCredentialCapabilities }}
            - {name: credential-scopes, mountPath: /credential-scopes, readOnly: true}
            {{- end }}
            - {name: definitions, mountPath: /definitions, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.reviewedCredentialCapabilities }}
        - name: credential-scopes
          configMap: {name: {{ include "openworkflow-workflow-bundle.name" . }}-credential-scopes}
        {{- end }}
        - name: definitions
          configMap: {name: {{ include "openworkflow-workflow-bundle.name" . }}}
        # The JVM writes its performance data here; the root filesystem is read-only.
        - {name: tmp, emptyDir: {}}
{{- end }}
