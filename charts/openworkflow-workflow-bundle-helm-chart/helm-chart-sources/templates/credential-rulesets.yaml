{{- if or .Values.credentialRulesets .Values.sandboxRuleset }}
{{- $approver := required "credentialRulesetApprover.secretName is required with credential rulesets" .Values.credentialRulesetApprover.secretName }}
{{- $target := required "decisionEngine.target is required with credential rulesets" .Values.decisionEngine.target }}
{{- if and .Values.credentialRulesets (not .Values.credentialRulesetBundles) }}
{{- fail "credentialRulesetBundles is required with credentialRulesets: every bundle alias the rulesets name" }}
{{- end }}
{{- if eq $approver .Values.identity.secretName }}
{{- fail "credentialRulesetApprover.secretName must not be the workflow publisher's Secret: a publisher never writes a grant" }}
{{- end }}
{{- if .Values.credentialRulesets }}
# The bundle's reviewed credential rulesets, each workflow's <workflow>.drl. Not a hook: it stays,
# so tenant administration publishes them into a tenant it creates later, before the bundle's
# workflows (KubernetesWorkflowBundleSource reads ConfigMaps with the credential-rulesets label; the
# workflow-bundle label is only on workflow ConfigMaps).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openworkflow-workflow-bundle.name" . }}-credential-rulesets
  labels:
    {{- include "openworkflow-workflow-bundle.plainLabels" . | nindent 4 }}
    openworkflow.forwardmeasure.com/credential-rulesets: "true"
    openworkflow.forwardmeasure.com/workflow-namespace: {{ .Values.workflowNamespace | quote }}
    {{- with .Values.onlyTenant }}
    openworkflow.forwardmeasure.com/only-tenant: {{ . | quote }}
    {{- end }}
  annotations:
    # alias -> workflow namespace of every bundle the rulesets name (@BUNDLE:<alias>@).
    openworkflow.forwardmeasure.com/credential-ruleset-bundles: {{ toJson .Values.credentialRulesetBundles | quote }}
data:
  {{- range $file, $ruleset := .Values.credentialRulesets }}
  {{ $file }}: |
    {{- $ruleset | nindent 4 }}
  {{- end }}
---
{{- end }}
# Publishes the rulesets into the decision engine as the credential approver (its own identity),
# before the publish Job (hook weight 0) publishes the workflows that need them. Repeatable: a
# ruleset already active as this text is left as it is.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openworkflow-workflow-bundle.name" . }}-credential-rulesets
  labels:
    {{- include "openworkflow-workflow-bundle.plainLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  {{- /* The largest Kubernetes allows (no unlimited value): retried until it succeeds or a person
  deletes it; no deadline. */}}
  backoffLimit: 2147483647
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "openworkflow-workflow-bundle.plainLabels" . | nindent 8 }}
      annotations:
        # New rulesets change this Job, so the release upgrades and they are published.
        openworkflow.forwardmeasure.com/credential-rulesets: {{ toJson .Values.credentialRulesets | sha256sum | quote }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: credential-rulesets
          image: {{ include "openworkflow-workflow-bundle.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - {name: OPENWORKFLOW_PUBLISHER_RUN, value: credential-rulesets}
            {{- include "openworkflow-workflow-bundle.dependencyRetryEnv" . | nindent 12 }}
            {{- with .Values.credentialRulesetApprover.tokenTimeout }}
            - {name: OPENWORKFLOW_CREDENTIAL_RULESET_TOKEN_TIMEOUT, value: {{ . | quote }}}
            {{- end }}
            - {name: OPENWORKFLOW_PUBLISHER_TENANTS, value: {{ join "," .Values.tenants | quote }}}
            - {name: OPENWORKFLOW_DECISION_ENGINE_TARGET, value: {{ $target | quote }}}
            - name: OPENWORKFLOW_PUBLISHER_KEYCLOAK_TOKEN_URL
              value: {{ required "fowf.keycloakTokenUrl is required" .Values.fowf.keycloakTokenUrl | quote }}
            {{- if .Values.sandboxRuleset }}
            - {name: OPENWORKFLOW_CREDENTIAL_RULESETS_SANDBOX, value: "true"}
            {{- else }}
            - {name: OPENWORKFLOW_PUBLISHER_WORKFLOW_NAMESPACE, value: {{ .Values.workflowNamespace | quote }}}
            - {name: OPENWORKFLOW_CREDENTIAL_RULESETS_DIR, value: /credential-rulesets}
            - {name: OPENWORKFLOW_CREDENTIAL_RULESETS_BUNDLES, value: {{ toJson .Values.credentialRulesetBundles | quote }}}
            {{- end }}
            - {name: OPENWORKFLOW_CREDENTIAL_APPROVER_CLIENT_ID, valueFrom: {secretKeyRef: {name: {{ $approver | quote }}, key: {{ .Values.credentialRulesetApprover.clientIdKey | quote }}}}}
            - {name: OPENWORKFLOW_CREDENTIAL_APPROVER_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: {{ $approver | quote }}, key: {{ .Values.credentialRulesetApprover.clientSecretKey | quote }}}}}
          volumeMounts:
            {{- if .Values.credentialRulesets }}
            - {name: credential-rulesets, mountPath: /credential-rulesets, readOnly: true}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.credentialRulesets }}
        - name: credential-rulesets
          configMap: {name: {{ include "openworkflow-workflow-bundle.name" . }}-credential-rulesets}
        {{- end }}
        - {name: tmp, emptyDir: {}}
{{- end }}
