{{- include "openworkflow-workflow-bundle.validate" . }}
{{- if .Values.definitions }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openworkflow-workflow-bundle.name" . }}
  labels:
    {{- include "openworkflow-workflow-bundle.labels" . | nindent 4 }}
data:
  {{- range $file, $document := .Values.definitions }}
  {{ $file }}: |
    {{- $document | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.contracts }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openworkflow-workflow-bundle.name" . }}-contracts
  # Not the workflow-bundle label: tenant administration reads labelled ConfigMaps as workflows.
  labels:
    {{- include "openworkflow-workflow-bundle.plainLabels" . | nindent 4 }}
  {{- with include "openworkflow-workflow-bundle.contractRoles" . | fromJson }}
  # The roles the release declares for its contract files (file name -> role), which tenant
  # administration records on each version it uploads into a tenant created later.
  annotations:
    openworkflow.forwardmeasure.com/contract-roles: {{ toJson . | quote }}
  {{- end }}
data:
  {{- range $file, $entry := .Values.contracts }}
  {{- $text := $entry }}
  {{- if kindIs "map" $entry }}{{ $text = $entry.content }}{{ end }}
  {{ $file }}: |
    {{- $text | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.definitions .Values.reviewedCredentialCapabilities }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openworkflow-workflow-bundle.name" . }}-credential-scopes
  labels:
    {{- include "openworkflow-workflow-bundle.labels" . | nindent 4 }}
data:
  reviewed-scopes.json: |
    {{- toPrettyJson .Values.reviewedCredentialCapabilities | nindent 4 }}
{{- end }}
