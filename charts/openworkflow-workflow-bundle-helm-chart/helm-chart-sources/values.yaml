# The workflow namespace, e.g. entity-intelligence (not a Kubernetes namespace): the publisher fills
# it into each document's "@WORKFLOW_NAMESPACE@". Workflows are named <workflowNamespace>-<document.name>.
workflowNamespace: ""

# Required, no default: whose contracts this bundle publishes, which decides the registry group its
# contract files go in and the DID its definitions name them by.
#   platform - contracts every tenant shares (a product's or the platform's own API): uploaded once to
#              group platform.<workflowNamespace>; @BUNDLE_DID@ renders to
#              did:<didMethod>:bundle:<workflowNamespace>.
#   tenant   - contracts that belong to each target tenant: uploaded to each tenant's own group
#              tenant.<tenant id>.<workflowNamespace> (the tenant id derived from its DID); @BUNDLE_DID@
#              renders, in each tenant, to did:<didMethod>:tenant:<tenant id>:bundle:<workflowNamespace>.
# Studio's schema browser shows a tenant only platform.* groups and its own tenant.<tenant id>.* groups.
scope: ""

# File name -> workflow document (YAML text), e.g. filled with .Files or readFile in the helmfile:
#   definitions:
#     population-screening.yaml: |
#       document: {dsl: '1.0.3', namespace: ..., name: population-screening, version: '1.0.0'}
#       ...
# A release with definitions renders the publish Job, which publishes every one into every tenant.
definitions: {}

# File name -> contract file the bundle owns (OpenAPI, AsyncAPI, a .proto, or a JSON Schema contract
# file such as <workflow>.contract.json, <workflow>.<step>.form.json or <event>.data.schema.json; YAML
# or JSON). A release with contracts renders the upload Job, which uploads every one to the
# platform's registry, in the group the bundle's scope names (above), so that they are there before
# any workflow that names them is published. A workflow names one by DID URL, never by registry URL
# (the registry host differs per environment):
#   endpoint: "@BUNDLE_DID@/<file name>"                  # a file of this bundle
#   endpoint: "@BUNDLE_DID:<alias>@/<file name>"          # a file of the bundle contractBundles names
# The publisher renders each to the DID URL of the registry version it names, keeping any fragment,
# e.g. did:<didMethod>:bundle:<workflowNamespace>/<file name>?version=3#/$defs/output. A contract
# file's relative references ($ref: 'messages.yaml#/...') name the bundle's other contract files. The
# map is flat: a DID URL names a file by its file name alone.
contracts: {}

# Required with definitions, no default: every other bundle the definitions name contracts of, by the
# alias they use (@BUNDLE_DID:<alias>@). Each entry is that bundle's workflow namespace and scope:
#   contractBundles:
#     selfsame:  {workflowNamespace: selfsame,  scope: platform}
#     indexical: {workflowNamespace: indexical, scope: platform}
# A bundle whose definitions name no other bundle's contracts states that with an empty map ({}). A
# definition that uses an alias this map does not declare fails to render.
contractBundles: null

# The platform's DID method (shared platform.identity.didMethod), set on the publisher as
# FORWARDMEASURE_DID_METHOD. Required when any definition contains @BUNDLE_DID@; no default.
didMethod: ""

# Aliases of the tenants entitled to this workflow namespace; every one is published to. Required with
# definitions, and with contracts of scope tenant (each tenant's own registry group).
tenants: []

# The one tenant this bundle is for, when it names that tenant's own services. A tenant created later
# doesn't receive it. Empty means every tenant, including any created later.
onlyTenant: ""

fowf:
  # definition-management, e.g. http://openworkflow-definition-management.<namespace>.svc
  definitionBaseUrl: ""
  # The realm's token endpoint, e.g. <issuer>/protocol/openid-connect/token
  keycloakTokenUrl: ""

registry:
  # The platform's Apicurio Registry API (shared endpoints.registry.apiUrl); required with contracts,
  # and with definitions that name any bundle's contracts (the publisher pins each reference to the
  # registry version it names).
  apiUrl: ""

# fowf's one publisher identity (openworkflow-platform-clients writes it). It creates, validates
# and publishes each definition itself.
identity:
  secretName: openworkflow-platform-clients
  clientIdKey: OPENWORKFLOW_WORKFLOW_PUBLISHER_CLIENT_ID
  clientSecretKey: OPENWORKFLOW_WORKFLOW_PUBLISHER_CLIENT_SECRET

# forwardmeasure-openworkflow's publisher image. Pull it by digest (the platform's
# imageVersions.openworkflowWorkflowPublisher); the tag is used only while digest is empty.
image:
  repository: docker.io/forwardmeasure/openworkflow-workflow-publisher
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

# Our images are in a private Docker Hub org; same default as java-microservice-helm-chart (the
# platform's shared imagePull Secret, present in fowf's namespace).
imagePullSecrets:
  - name: docker-io-credentials

backoffLimit: 6
activeDeadlineSeconds: 600
ttlSecondsAfterFinished: 86400

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

resources:
  requests: {cpu: 50m, memory: 192Mi}
  limits: {cpu: "1", memory: 384Mi}

serviceAccount:
  name: ""
  automount: false

# Deployment-reviewed scopes keyed by the full <workflowNamespace>-<document.name>. The publisher attaches
# these to the immutable revision and installs them using a separate, restricted approver identity.
# Workflow source cannot replace these scopes. Keep this configuration under deployment review.
reviewedCredentialCapabilities: {}
credentialApprover:
  secretName: openworkflow-platform-clients
  clientIdKey: OPENWORKFLOW_CREDENTIAL_APPROVER_CLIENT_ID
  clientSecretKey: OPENWORKFLOW_CREDENTIAL_APPROVER_CLIENT_SECRET
