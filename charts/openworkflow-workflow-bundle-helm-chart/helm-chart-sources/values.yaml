# The product's moniker, e.g. fei. Workflows are named <domain>-<document.name>.
domain: ""

# File name -> workflow document (YAML text), e.g. filled with .Files or readFile in the helmfile:
#   definitions:
#     population-screening.yaml: |
#       document: {dsl: '1.0.3', namespace: ..., name: population-screening, version: '1.0.0'}
#       ...
definitions: {}

# File name -> API document (AsyncAPI, OpenAPI or JSON Schema; YAML or JSON) the workflows
# reference. Uploaded to the platform's registry under group <domain> before any workflow is
# published. A workflow names one by DID URL, never by registry URL (the registry host differs per
# environment):
#   endpoint: "@BUNDLE_DID@/<file name>"
# The publisher renders @BUNDLE_DID@ to this bundle's DID, did:<didMethod>:bundle:<domain>, so the
# definition stores did:<didMethod>:bundle:<domain>/<file name>; definition-management resolves that
# from the registry with its own credentials. A document's relative references ($ref:
# 'messages.yaml#/...') resolve to the bundle's other documents the same way. The map is flat: a
# DID URL names a document by its file name alone.
apiDocuments: {}

# The platform's DID method (shared platform.identity.didMethod), set on the publisher as
# FORWARDMEASURE_DID_METHOD. Required when any definition contains @BUNDLE_DID@; no default.
didMethod: ""

# Aliases of the tenants entitled to this domain; every one is published to.
tenants: []

fowf:
  # definition-management, e.g. http://openworkflow-definition-management.<namespace>.svc
  definitionBaseUrl: ""
  # The realm's token endpoint, e.g. <issuer>/protocol/openid-connect/token
  keycloakTokenUrl: ""

registry:
  # The platform's Apicurio Registry API (shared endpoints.registry.apiUrl); required with apiDocuments.
  apiUrl: ""

# fowf's one publisher identity (openworkflow-platform-clients writes it). It creates, validates
# and publishes each definition itself.
identity:
  secretName: openworkflow-bootstrap
  clientIdKey: OPENWORKFLOW_WORKFLOW_PUBLISHER_CLIENT_ID
  clientSecretKey: OPENWORKFLOW_WORKFLOW_PUBLISHER_CLIENT_SECRET

# forwardmeasure-openworkflow's publisher image. Pull it by digest (the platform's
# imageVersions.openworkflowWorkflowPublisher); the tag is used only while digest is empty.
image:
  repository: docker.io/forwardmeasure/openworkflow-workflow-publisher
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

# Our images are in a private Docker Hub org; same default as java-microservice-helm-chart (the
# platform's shared imagePull Secret, present in fowf's namespace).
imagePullSecrets:
  - name: docker-io-credentials

backoffLimit: 6
activeDeadlineSeconds: 600
ttlSecondsAfterFinished: 86400

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

resources:
  requests: {cpu: 50m, memory: 192Mi}
  limits: {cpu: "1", memory: 384Mi}

serviceAccount:
  name: ""
  automount: false
