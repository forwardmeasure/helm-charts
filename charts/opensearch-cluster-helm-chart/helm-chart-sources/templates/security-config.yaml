# The security index must contain a bcrypt hash, never the clear-text password
# used by clients. ESO materialises this configuration from the independently
# managed username and bcrypt hash in the configured secret store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "opensearch-wrapper.name" . }}-security-config
  namespace: {{ include "opensearch-wrapper.namespace" . }}
  labels:
    {{- include "opensearch-wrapper.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.securityConfig.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        config.yml: |
          _meta: {type: config, config_version: 2}
          config:
            dynamic:
              http: {anonymous_auth_enabled: false}
              authc:
                basic_internal_auth_domain:
                  http_enabled: true
                  transport_enabled: true
                  order: 0
                  http_authenticator: {type: basic, challenge: true}
                  authentication_backend: {type: internal}
              authz: {}
              do_not_fail_on_forbidden: false
              do_not_fail_on_forbidden_empty: false
              hosts_resolver_mode: ip-only
              filtered_alias_mode: warn
              multi_rolespan_enabled: true
              kibana:
                multitenancy_enabled: true
                server_username: {{ `{{ .username }}` | quote }}
                index: .opensearch_dashboards
              license: null
              disable_rest_auth: false
              disable_intertransport_auth: false
              auth_failure_listeners: {}
              transport_userrname_attribute: null
              on_behalf_of: {}
        internal_users.yml: |
          _meta: {type: internalusers, config_version: 2}
          {{ `{{ .username }}` }}:
            hash: {{ `{{ .passwordHash }}` | quote }}
            reserved: true
            backend_roles: [platform-admin]
        roles.yml: |
          _meta: {type: roles, config_version: 2}
          platform-admin:
            reserved: false
            hidden: false
            cluster_permissions: ["*"]
            index_permissions:
              - index_patterns: ["*"]
                allowed_actions: ["*"]
            tenant_permissions:
              - tenant_patterns: ["*"]
                allowed_actions: [kibana_all_read, kibana_all_write]
        roles_mapping.yml: |
          _meta: {type: rolesmapping, config_version: 2}
          platform-admin:
            backend_roles: [platform-admin]
            users: [{{ `{{ .username }}` | quote }}]
        tenants.yml: |
          _meta: {type: tenants, config_version: 2}
          platform_tenant:
            description: ForwardMeasure platform tenant
        action_groups.yml: |
          _meta: {type: actiongroups, config_version: 2}
        nodes_dn.yml: |
          _meta: {type: nodesdn, config_version: 2}
          config:
            nodes_dn:
              - "CN={{ required `certificates.node.dnsName must be set` .Values.certificates.node.dnsName }}"
              - "CN=opensearch-cluster-master"
              - "CN=opensearch-cluster-master.{{ include `opensearch-wrapper.namespace` . }}.svc.cluster.local"
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "externalSecret.keys.username.remoteKey is required" .Values.externalSecret.keys.username.remoteKey | quote }}
    - secretKey: passwordHash
      remoteRef:
        key: {{ required "securityConfig.passwordHashRemoteKey is required" .Values.securityConfig.passwordHashRemoteKey | quote }}
