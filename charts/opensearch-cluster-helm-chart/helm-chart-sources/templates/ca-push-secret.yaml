{{/*
PushSecret – publishes the cluster's private root CA certificate (ca.crt of the cert-manager
Secret opensearch-root-ca, never its key) to the same ClusterSecretStore the admin credentials come
from, so every client of this cluster reads the CA from the platform's one secret store and can
verify the https endpoint. Off unless externalSecret.caCertificate.remoteKey is set.
*/}}
{{- if .Values.externalSecret.caCertificate.remoteKey }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: opensearch-root-ca
  namespace: {{ include "opensearch-wrapper.namespace" . }}
  labels:
    {{- include "opensearch-wrapper.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: {{ .Values.externalSecret.clusterSecretStore }}
      kind: ClusterSecretStore
  selector:
    secret:
      name: opensearch-root-ca
  data:
    - match:
        secretKey: ca.crt
        remoteRef:
          remoteKey: {{ .Values.externalSecret.caCertificate.remoteKey }}
{{- end }}
