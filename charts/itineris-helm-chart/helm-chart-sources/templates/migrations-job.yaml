{{- if .Values.controlPlane.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "itineris.suffixedName" (dict "root" . "suffix" "migrations") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "itineris.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  {{- /* How often the Job runs again after it fails (a dependency failing or unreachable):
  controlPlane.migrations.backoffLimit, which the release fills from the platform's
  dependency-retry attempts (decision (h) of the limits sweep's Item R); a person re-runs the
  release after that. No deadline. */}}
  {{- if not (regexMatch "^[0-9]+$" (toString .Values.controlPlane.migrations.backoffLimit)) }}
  {{- fail (printf "controlPlane.migrations.backoffLimit must be a whole number of at least 0, not '%v'" .Values.controlPlane.migrations.backoffLimit) }}
  {{- end }}
  backoffLimit: {{ .Values.controlPlane.migrations.backoffLimit | int }}
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrations
          image: {{ include "itineris.migrationsImage" . | quote }}
          imagePullPolicy: {{ .Values.controlPlane.migrations.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ITINERIS_CONTROL_PLANE_DB_URL
              value: {{ .Values.controlPlane.database.url | quote }}
            - name: ITINERIS_MIGRATIONS_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlPlane.migrations.ownerSecret.name }}
                  key: {{ .Values.controlPlane.migrations.ownerSecret.usernameKey }}
            - name: ITINERIS_MIGRATIONS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlPlane.migrations.ownerSecret.name }}
                  key: {{ .Values.controlPlane.migrations.ownerSecret.passwordKey }}
            - name: ITINERIS_CONTROL_PLANE_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlPlane.database.runtimeSecret.name }}
                  key: {{ .Values.controlPlane.database.runtimeSecret.usernameKey }}
          resources:
            {{- toYaml .Values.controlPlane.migrations.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
