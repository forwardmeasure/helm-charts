apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "itineris.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "itineris.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "itineris.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "itineris.labels" . | nindent 8 }}
      annotations:
        {{- if .Values.opensearch.ssl.enabled }}
        traffic.sidecar.istio.io/excludeOutboundPorts: {{ .Values.opensearch.port | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "itineris.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.itineris.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: itineris
          image: {{ include "itineris.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8182
              protocol: TCP
          env:
            - name: ITINERIS_KEYCLOAK_ISSUER
              value: {{ .Values.itineris.keycloakIssuer | quote }}
            - name: ITINERIS_CLIENT_ID
              value: {{ .Values.itineris.clientId | quote }}
            - name: ITINERIS_ORGANIZATION_CLIENT_ID
              value: {{ .Values.itineris.organizationClientId | quote }}
            - name: ITINERIS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.itineris.clientSecret.secretName }}
                  key: {{ .Values.itineris.clientSecret.secretKey }}
            - name: JDK_JAVA_OPTIONS
              value: {{ .Values.itineris.javaOptions | quote }}
            - name: ITINERIS_CASSANDRA_HOSTS
              value: {{ .Values.cql.hosts | quote }}
            - name: ITINERIS_CASSANDRA_LOCAL_DATACENTER
              value: {{ .Values.cql.localDatacenter | quote }}
            - name: ITINERIS_CASSANDRA_REPLICATION_FACTOR
              value: {{ .Values.cql.replicationFactor | quote }}
            - name: itineris.graph-defaults.storage.username
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cql.credentialsSecret.name }}
                  key: {{ .Values.cql.credentialsSecret.usernameKey }}
            - name: itineris.graph-defaults.storage.password
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cql.credentialsSecret.name }}
                  key: {{ .Values.cql.credentialsSecret.passwordKey }}
            - name: ITINERIS_OPENSEARCH_HOSTS
              value: {{ .Values.opensearch.hosts | quote }}
            - name: itineris.graph-defaults.index.search.opensearch.http.auth.type
              value: "basic"
            - name: itineris.graph-defaults.index.search.opensearch.http.auth.basic.username
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.opensearch.credentialsSecret.name }}
                  key: {{ .Values.opensearch.credentialsSecret.usernameKey }}
            - name: itineris.graph-defaults.index.search.opensearch.http.auth.basic.password
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.opensearch.credentialsSecret.name }}
                  key: {{ .Values.opensearch.credentialsSecret.passwordKey }}
            - name: itineris.graph-defaults.index.search.opensearch.ssl.enabled
              value: {{ .Values.opensearch.ssl.enabled | quote }}
            - name: itineris.graph-defaults.index.search.opensearch.ssl.disable-hostname-verification
              value: {{ .Values.opensearch.ssl.disableHostnameVerification | quote }}
            - name: itineris.graph-defaults.index.search.opensearch.ssl.allow-self-signed-certificates
              value: {{ .Values.opensearch.ssl.allowSelfSignedCertificates | quote }}
            - name: ITINERIS_GRAPH_CACHE_MAXIMUM_SIZE
              value: {{ .Values.itineris.graphCacheMaximumSize | quote }}
            - name: ITINERIS_GRAPH_CACHE_IDLE_TIMEOUT
              value: {{ .Values.itineris.graphCacheIdleTimeout | quote }}
            - name: ITINERIS_GREMLIN_TIMEOUT
              value: {{ .Values.itineris.gremlinTimeout | quote }}
            - name: ITINERIS_GREMLIN_THREADS
              value: {{ .Values.itineris.gremlinThreads | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.extraVolumeMounts }}
          volumeMounts:
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if .Values.extraVolumes }}
      volumes:
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}