apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "itineris.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "itineris.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "itineris.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "itineris.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        {{- if .Values.opensearch.ssl.enabled }}
        traffic.sidecar.istio.io/excludeOutboundPorts: {{ .Values.opensearch.port | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "itineris.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.itineris.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: itineris
          image: {{ include "itineris.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8182
              protocol: TCP
          env:
            - name: ITINERIS_CONTROL_PLANE_DB_URL
              value: {{ .Values.controlPlane.database.url | quote }}
            - name: ITINERIS_CONTROL_PLANE_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlPlane.database.runtimeSecret.name }}
                  key: {{ .Values.controlPlane.database.runtimeSecret.usernameKey }}
            - name: ITINERIS_CONTROL_PLANE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlPlane.database.runtimeSecret.name }}
                  key: {{ .Values.controlPlane.database.runtimeSecret.passwordKey }}
            - name: ITINERIS_TENANT_DOMAIN
              value: {{ .Values.itineris.tenantDomain | quote }}
            - name: ITINERIS_TOKEN_AUDIENCE
              value: {{ .Values.itineris.tokenAudience | quote }}
            - name: ITINERIS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ITINERIS_ANALYTICS_IMAGE_PULL_POLICY
              value: {{ .Values.analyticsJob.image.pullPolicy | quote }}
            - name: ITINERIS_ANALYTICS_IMAGE
              value: {{ include "itineris.analyticsImage" . | quote }}
            - name: ITINERIS_ANALYTICS_SERVICE_ACCOUNT
              value: {{ include "itineris.analyticsServiceAccountName" . | quote }}
            - name: ITINERIS_ANALYTICS_DEADLINE
              value: {{ .Values.analytics.deadline | quote }}
            - name: ITINERIS_ANALYTICS_POD_RETENTION
              value: {{ .Values.analytics.podRetention | quote }}
            - name: ITINERIS_ANALYTICS_RETENTION_INTERVAL
              value: {{ .Values.analytics.retentionInterval | quote }}
            - name: ITINERIS_SPARK_MASTER
              value: {{ .Values.analytics.master | quote }}
            - name: ITINERIS_SPARK_CONFIGURATION
              value: {{ .Values.analytics.sparkConfigurationProperties | quote }}
            - name: ITINERIS_ANALYTICS_CASSANDRA_PASSWORD_REF
              value: {{ printf "%s/%s" .Values.cql.credentialsSecret.name .Values.cql.credentialsSecret.passwordKey | quote }}
            - name: ITINERIS_ANALYTICS_OPENSEARCH_PASSWORD_REF
              value: {{ printf "%s/%s" .Values.opensearch.credentialsSecret.name .Values.opensearch.credentialsSecret.passwordKey | quote }}
            {{- range $name, $value := .Values.analytics.resources.requests }}
            - name: {{ printf "itineris.analytics.requests.%s" $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $name, $value := .Values.analytics.resources.limits }}
            - name: {{ printf "itineris.analytics.limits.%s" $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.imagePullSecrets }}
            - name: itineris.analytics.kubernetes.image-pull-secrets
              {{- $pullSecrets := list }}
              {{- range .Values.imagePullSecrets }}
              {{- $pullSecrets = append $pullSecrets .name }}
              {{- end }}
              value: {{ join "," $pullSecrets | quote }}
            {{- end }}
            - name: ITINERIS_KEYCLOAK_ISSUER
              value: {{ .Values.itineris.keycloakIssuer | quote }}
            - name: ITINERIS_CLIENT_ID
              value: {{ .Values.itineris.clientId | quote }}
            - name: ITINERIS_ORGANIZATION_CLIENT_ID
              value: {{ .Values.itineris.organizationClientId | quote }}
            - name: ITINERIS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.itineris.clientSecret.secretName }}
                  key: {{ .Values.itineris.clientSecret.secretKey }}
            - name: JDK_JAVA_OPTIONS
              value: {{ .Values.itineris.javaOptions | quote }}
            {{- include "itineris.backendTlsEnv" (dict "backend" "CASSANDRA" "tls" .Values.cql.ssl "analytics" true) | nindent 12 }}
            {{- include "itineris.backendTlsEnv" (dict "backend" "OPENSEARCH" "tls" .Values.opensearch.ssl "analytics" true) | nindent 12 }}
            - name: ITINERIS_CASSANDRA_HOSTS
              value: {{ .Values.cql.hosts | quote }}
            - name: ITINERIS_CASSANDRA_LOCAL_DATACENTER
              value: {{ .Values.cql.localDatacenter | quote }}
            - name: ITINERIS_CASSANDRA_PORT
              value: {{ .Values.cql.port | quote }}
            - name: ITINERIS_CASSANDRA_REPLICATION_STRATEGY
              value: {{ .Values.cql.replicationStrategy | quote }}
            - name: ITINERIS_CASSANDRA_DATACENTER_REPLICATION
              value: {{ .Values.cql.datacenterReplication | quote }}
            - name: ITINERIS_CASSANDRA_REPLICATION_FACTOR
              value: {{ .Values.cql.replicationFactor | quote }}
            - name: ITINERIS_CASSANDRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cql.credentialsSecret.name }}
                  key: {{ .Values.cql.credentialsSecret.usernameKey }}
            - name: ITINERIS_CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cql.credentialsSecret.name }}
                  key: {{ .Values.cql.credentialsSecret.passwordKey }}
            - name: ITINERIS_OPENSEARCH_PORT
              value: {{ .Values.opensearch.port | quote }}
            - name: ITINERIS_OPENSEARCH_HOSTS
              value: {{ .Values.opensearch.hosts | quote }}
            - name: ITINERIS_OPENSEARCH_ENDPOINTS
              value: {{ .Values.opensearch.endpoints | quote }}
            - name: ITINERIS_OPENSEARCH_AUTH_TYPE
              value: "basic"
            - name: ITINERIS_OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.opensearch.credentialsSecret.name }}
                  key: {{ .Values.opensearch.credentialsSecret.usernameKey }}
            - name: ITINERIS_OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.opensearch.credentialsSecret.name }}
                  key: {{ .Values.opensearch.credentialsSecret.passwordKey }}
            - name: itineris.graph-defaults.index.search.opensearch.ssl.enabled
              value: {{ .Values.opensearch.ssl.enabled | quote }}
            - name: itineris.graph-defaults.index.search.opensearch.ssl.disable-hostname-verification
              value: {{ .Values.opensearch.ssl.disableHostnameVerification | quote }}
            - name: itineris.graph-defaults.index.search.opensearch.ssl.allow-self-signed-certificates
              value: {{ .Values.opensearch.ssl.allowSelfSignedCertificates | quote }}
            - name: ITINERIS_GRAPH_CACHE_MAXIMUM_SIZE
              value: {{ .Values.itineris.graphCacheMaximumSize | quote }}
            - name: ITINERIS_GRAPH_CACHE_IDLE_TIMEOUT
              value: {{ .Values.itineris.graphCacheIdleTimeout | quote }}
            - name: ITINERIS_GREMLIN_TIMEOUT
              value: {{ .Values.itineris.gremlinTimeout | quote }}
            - name: ITINERIS_GREMLIN_THREADS
              value: {{ .Values.itineris.gremlinThreads | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "itineris.tlsMounts" . | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "itineris.tlsVolumes" . | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
