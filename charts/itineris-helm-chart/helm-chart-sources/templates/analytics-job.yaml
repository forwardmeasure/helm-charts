{{- if .Values.analyticsJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" (include "itineris.fullname" .) .Values.analyticsJob.name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "itineris.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-runner
spec:
  backoffLimit: {{ .Values.analyticsJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.analyticsJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "itineris.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: analytics-runner
    spec:
      restartPolicy: Never
      automountServiceAccountToken: {{ hasPrefix "k8s://" .Values.analyticsJob.master }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "itineris.analyticsServiceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: analytics-runner
          image: {{ include "itineris.analyticsImage" . }}
          imagePullPolicy: {{ .Values.analyticsJob.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: SPARK_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SPARK_DRIVER_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPARK_DRIVER_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SPARK_SERVICE_ACCOUNT
              value: {{ include "itineris.analyticsServiceAccountName" . | quote }}
            - name: SPARK_EXECUTOR_IMAGE
              value: {{ include "itineris.analyticsImage" . | quote }}
            - name: ITINERIS_RUN_ID
              value: {{ required "analyticsJob.runId is required when enabled" .Values.analyticsJob.runId | quote }}
            - name: ITINERIS_JOB_NAME
              value: {{ required "analyticsJob.jobName is required when enabled" .Values.analyticsJob.jobName | quote }}
            - name: ITINERIS_TENANT_ID
              value: {{ required "analyticsJob.tenantId is required when enabled" .Values.analyticsJob.tenantId | quote }}
            - name: ITINERIS_GRAPH_NAME
              value: {{ required "analyticsJob.graphName is required when enabled" .Values.analyticsJob.graphName | quote }}
            - name: ITINERIS_KEYSPACE
              value: {{ required "analyticsJob.keyspace is required when enabled" .Values.analyticsJob.keyspace | quote }}
            - name: ITINERIS_INDEX_PREFIX
              value: {{ required "analyticsJob.indexPrefix is required when enabled" .Values.analyticsJob.indexPrefix | quote }}
            - name: ITINERIS_GRAPH_CONFIGURATION
              value: {{ .Values.analyticsJob.graphConfigurationProperties | quote }}
            - name: ITINERIS_JOB_PARAMETERS
              value: {{ .Values.analyticsJob.parametersProperties | quote }}
            - name: ITINERIS_SPARK_CONFIGURATION
              value: {{ include "itineris.directSparkConfiguration" . | quote }}
            - name: SPARK_MASTER
              value: {{ .Values.analyticsJob.master | quote }}
            {{- include "itineris.backendTlsEnv" (dict "backend" "CASSANDRA" "tls" .Values.cql.ssl "analytics" false) | nindent 12 }}
            {{- include "itineris.backendTlsEnv" (dict "backend" "OPENSEARCH" "tls" .Values.opensearch.ssl "analytics" false) | nindent 12 }}
            - name: ITINERIS_CASSANDRA_HOSTS
              value: {{ .Values.cql.hosts | quote }}
            - name: ITINERIS_CASSANDRA_LOCAL_DATACENTER
              value: {{ .Values.cql.localDatacenter | quote }}
            - name: ITINERIS_CASSANDRA_REPLICATION_FACTOR
              value: {{ .Values.cql.replicationFactor | quote }}
            - name: ITINERIS_CASSANDRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cql.credentialsSecret.name }}
                  key: {{ .Values.cql.credentialsSecret.usernameKey }}
            - name: ITINERIS_CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cql.credentialsSecret.name }}
                  key: {{ .Values.cql.credentialsSecret.passwordKey }}
            - name: ITINERIS_OPENSEARCH_HOSTS
              value: {{ .Values.opensearch.hosts | quote }}
            - name: itineris.graph-defaults.index.search.backend
              value: opensearch
            - name: itineris.graph-defaults.index.search.interface
              value: REST_CLIENT
            - name: itineris.graph-defaults.index.search.opensearch.http.auth.type
              value: basic
            - name: ITINERIS_OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.opensearch.credentialsSecret.name }}
                  key: {{ .Values.opensearch.credentialsSecret.usernameKey }}
            - name: ITINERIS_OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.opensearch.credentialsSecret.name }}
                  key: {{ .Values.opensearch.credentialsSecret.passwordKey }}
            - name: itineris.graph-defaults.index.search.opensearch.ssl.enabled
              value: {{ .Values.opensearch.ssl.enabled | quote }}
            - name: itineris.graph-defaults.index.search.opensearch.ssl.disable-hostname-verification
              value: {{ .Values.opensearch.ssl.disableHostnameVerification | quote }}
            - name: itineris.graph-defaults.index.search.opensearch.ssl.allow-self-signed-certificates
              value: {{ .Values.opensearch.ssl.allowSelfSignedCertificates | quote }}
          resources:
            {{- toYaml .Values.analyticsJob.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "itineris.tlsMounts" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "itineris.tlsVolumes" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
