{{- if .Values.analytics.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "itineris.analyticsServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "itineris.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.analytics.rbac.create }}
{{- if eq (include "itineris.serviceAccountName" .) (include "itineris.analyticsServiceAccountName" .) }}
{{- fail "Controller and analytics service accounts must differ when chart RBAC is enabled" }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "itineris.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "itineris.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "itineris.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "itineris.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "itineris.analyticsServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "itineris.analyticsServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "itineris.analyticsServiceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "itineris.analyticsServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
