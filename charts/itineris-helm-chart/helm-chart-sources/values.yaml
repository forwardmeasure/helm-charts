# -- Number of Itineris server replicas
replicaCount: 1

image:
  # -- Image registry
  registry: docker.io
  # -- Image repository
  repository: forwardmeasure/itineris
  # -- Image tag (ignored if digest is set)
  tag: "2.0.0-SNAPSHOT"
  # -- Image digest (takes precedence over tag if set)
  # e.g. sha256:abc123...
  digest: ""
  # -- Image pull policy
  pullPolicy: Always

# -- Image pull secrets
imagePullSecrets: []

# -- Override the chart name
nameOverride: ""
# -- Override the full resource name
fullnameOverride: ""

serviceAccount:
  # -- Create a service account
  create: true
  # -- Annotations for the service account
  annotations: {}
  # -- Service account name override
  name: ""

# -- Annotations for the pod
# Prometheus scrape annotations for Quarkus metrics; set podAnnotations to
# override or disable them when the cluster uses ServiceMonitor discovery.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /q/metrics
  prometheus.io/port: "8182"

# -- Security context for the pod
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# -- Security context for the container
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  # -- Service type
  type: ClusterIP
  # -- HTTP port for Gremlin, health, and metrics
  port: 8182

# -- Resource requests and limits
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity rules
affinity: {}

# -- Probe timing configuration
probes:
  startup:
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 5
  liveness:
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# -- Itineris 2.0 server configuration
itineris:
  keycloakIssuer: http://keycloak:8080/realms/forwardmeasure
  clientId: itineris
  organizationClientId: forwardmeasure-public
  clientSecret:
    secretName: itineris-auth-credentials
    secretKey: client-secret
  javaOptions: "-XX:MaxRAMPercentage=75"
  graphCacheMaximumSize: 64
  graphCacheIdleTimeout: 30M
  gremlinTimeout: 30S
  gremlinThreads: 16
  terminationGracePeriodSeconds: 60

# -- Cassandra defaults shared by tenant graphs; tenant keyspaces come from the catalog
cql:
  # -- Comma-separated Cassandra endpoints; each may include its port
  hosts: cassandra:9042
  # -- Cassandra local datacenter
  localDatacenter: datacenter1
  # -- Replication factor
  replicationFactor: 1
  credentialsSecret:
    name: itineris-cql-credentials
    usernameKey: username
    passwordKey: password

# -- OpenSearch defaults shared by tenant graphs
opensearch:
  # -- Comma-separated OpenSearch endpoints; each may include its port
  hosts: opensearch:9200
  port: 9200
  credentialsSecret:
    name: itineris-opensearch-credentials
    usernameKey: username
    passwordKey: password
  ssl:
    enabled: true
    disableHostnameVerification: true
    allowSelfSignedCertificates: true

# -- Extra environment variables
extraEnv: []

# -- Extra volumes and mounts for certificates or configuration
extraVolumes: []

# -- Extra volume mounts
extraVolumeMounts: []

# -- Optional one-shot analytics run; the default uses Spark local mode in this Job pod
analyticsJob:
  enabled: false
  name: analytics-run
  image:
    repository: forwardmeasure/itineris-spark-runner
    tag: "2.0.0-SNAPSHOT"
    digest: ""
    pullPolicy: Always
  runId: ""
  jobName: ""
  tenantId: ""
  graphName: ""
  keyspace: ""
  indexPrefix: ""
  master: local[*]
  parametersProperties: ""
  sparkConfigurationProperties: ""
  graphConfigurationProperties: ""
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi
