# ---------------------------------------------------------------------------
# values.yaml — Keycloak Helm chart defaults
# ---------------------------------------------------------------------------

nameOverride: ""
fullnameOverride: ""

replicaCount: 1
podManagementPolicy: Parallel
updateStrategy: RollingUpdate
terminationGracePeriodSeconds: 60
enableServiceLinks: true

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.5"
  digest: ""
  pullPolicy: Always

imagePullSecrets: []

service:
  type: ClusterIP

# ---------------------------------------------------------------------------
# Keycloak runtime configuration
# ---------------------------------------------------------------------------
keycloak:
  httpPort: 8080
  httpsPort: 8443
  managementPort: 9000

  hostname: ""
  hostnameDebug: "false"
  hostnameStrict: "false"

  # Prefer proxyHeaders for modern deployments behind ingress/gateway.
  # Set to "xforwarded" or "forwarded" as appropriate.
  proxyHeaders: ""
  proxy: ""

  httpEnabled: "true"
  httpRelativePath: /auth
  transactionXaEnabled: "false"
  logLevel: INFO
  log: console

  db:
    type: postgres
    schema: public
    driver: ""
    poolInitialSize: "5"
    poolMinSize: "5"
    poolMaxSize: "20"

    # Secret must contain:
    # - KC_DB_USERNAME
    # - KC_DB_PASSWORD
    # - KC_DB_URL
    # Optionally:
    # - KC_DB_URL_PROPERTIES
    credentialsSecret: keycloak-db-credentials
    urlPropertiesSecret: false

  # Secret must contain:
  # - KEYCLOAK_ADMIN
  # - KEYCLOAK_ADMIN_PASSWORD
  adminCredentialsSecret: keycloak-admin-credentials

# ---------------------------------------------------------------------------
# TLS
# Secret must contain:
# - tls.crt
# - tls.key
# ---------------------------------------------------------------------------
tls:
  secretName: forwardmeasure-keycloak-tls

# ---------------------------------------------------------------------------
# Realm bootstrap
# The realm file is always defined. Import behavior is controlled by realm.import:
# - none
# - bootstrap
# - overwrite
# ---------------------------------------------------------------------------
realm:
  import: overwrite

  realm: forwardmeasure
  displayName: ForwardMeasure
  loginTheme: keycloak.v2
  configMapKey: forwardmeasure-realm.json
  file: files/forwardmeasure-realm.json

  features: "scripts,authorization"

  # Secret must contain:
  # - FORWARDMEASURE_ADMIN_CONFIDENTIAL_CLIENT_SECRET
  clientSecretsSecret: keycloak-realm-client-secrets

  accessTokenLifespan: "3600"
  ssoSessionIdleTimeout: "1800"
  ssoSessionMaxLifespan: "36000"
  offlineSessionIdleTimeout: "2592000"
  accessCodeLifespan: "60"

  adminPublicClient:
    clientId: forwardmeasure-public
    name: "ForwardMeasure Public Client"
    redirectUri1: "https://tenant.example.com/*"
    redirectUri2: "http://localhost:3000/*"
    # Additional deployment-specific browser redirects are reconciled by the
    # post-install/post-upgrade hook without changing the bootstrap slots above.
    additionalRedirectUris: []
    webOrigin1: "https://tenant.example.com"
    webOrigin2: "http://localhost:3000"
    additionalWebOrigins: []
    audiences: []
    postLogoutRedirectUris: "https://tenant.example.com/*##http://localhost:3000/*"

  adminConfidentialClient:
    clientId: forwardmeasure-confidential
    name: "ForwardMeasure Confidential Client"

  # Additional least-privilege machine clients reconciled by the lifecycle
  # hook. `secretKey` names one key in `clientSecretsSecret`; secret values are
  # never rendered into a ConfigMap or Helm release values.
  serviceClients: []
  # - clientId: oks-operation-adapter
  #   name: OKS Operation Adapter
  #   secretKey: OKS_OPERATION_ADAPTER_CLIENT_SECRET
  #   realmRoles: [workflow-internal]
  #   audiences: [entity-intelligence-internal]
  #   claims:
  #     tenant_did: did:web:tenant.example.com
  #     actor_did: did:web:tenant.example.com:actors:oks-operation-adapter
  #     actor_type: SERVICE

# ---------------------------------------------------------------------------
# Bootstrap admin user
# Created by the post-install / post-upgrade hook.
# ---------------------------------------------------------------------------
bootstrapAdminUser:
  utilityImage:
    repository: docker.io/forwardmeasure/ml-model-utilities
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  username: "admin@forwardmeasure.com"
  email: "admin@forwardmeasure.com"
  firstName: "Admin"
  lastName: "User"
  tenantDid: "did:web:tenant.example.com"
  actorDid: "did:web:tenant.example.com:actors:platform-admin"
  actorType: "HUMAN"
  passwordSecret: keycloak-bootstrap-admin-user-credentials
  tenantGroupRoles: "dossier-control,investigation-control,evidence-control,audit-control"

  # -----------------------------------------------------------------------
  # ForwardMeasure platform roles (realm roles)
  #    1. platform-viewer
  #  🎯 Purpose
  #
  #  Read-only visibility into the platform.
  #
  #  ✅ Capabilities
  #  View users
  #  View roles
  #  View tenants
  #  View audit logs
  #  View system metadata/config
  #  ❌ Cannot
  #  Create/update/delete users
  #  Assign roles
  #  Create tenants
  #  Modify configuration
  #  💡 Think of it as:
  #
  #  “Observer / auditor / read-only admin”
  #
  #  2. platform-access-admin
  #  🎯 Purpose
  #
  #  Identity & access management (IAM) operator.
  #
  #  ✅ Capabilities
  #  Create users
  #  Update users
  #  Disable users
  #  Assign roles to users
  #  Manage role memberships
  #  Possibly manage groups
  #  ❌ Cannot
  #  Create tenants
  #  Modify platform configuration
  #  Perform system-level operations
  #  💡 Think of it as:
  #
  #  “User admin / IAM operator”
  #
  #  3. platform-admin
  #  🎯 Purpose
  #
  #  Full platform administrator.
  #
  #  ✅ Capabilities
  #
  #  Everything:
  #
  #  Create tenants
  #  Manage users
  #  Assign roles
  #  Configure platform settings
  #  Manage integrations
  #  Perform admin actions via APIs
  #  💡 Think of it as:
  #
  #  “ForwardMeasure platform administrator”
  # -----------------------------------------------------------------------
  platformRoles:
    viewer: platform-viewer
    accessAdmin: platform-access-admin
    platformAdmin: platform-admin

  # -----------------------------------------------------------------------
  # Keycloak realm-management roles for bootstrap user
  # (used for Keycloak administration, not platform auth)
  # -----------------------------------------------------------------------
  keycloakRealmManagementRoles: "manage-clients,manage-users,manage-realm,view-clients,view-users,query-clients,query-users"

  # -----------------------------------------------------------------------
  # Keycloak readiness tuning (for slow startups / cold clusters)
  # -----------------------------------------------------------------------
  keycloakReadySleepSeconds: 5
  keycloakReadyMaxAttempts: 60

# ---------------------------------------------------------------------------
# ServiceAccount
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Security contexts
# ---------------------------------------------------------------------------
podSecurityContext:
  fsGroup: 1000

containerSecurityContext:
  runAsUser: 1000

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

# ---------------------------------------------------------------------------
# Probes
# Target Keycloak management interface over HTTP.
# ---------------------------------------------------------------------------
readinessProbe:
  enabled: true
  # Empty derives the path from keycloak.httpRelativePath.
  path: ""
  port: 9000
  scheme: HTTP
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 18
  httpHeaders: []

livenessProbe:
  enabled: true
  # Empty derives the path from keycloak.httpRelativePath.
  path: ""
  port: 9000
  scheme: HTTP
  initialDelaySeconds: 300
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 6
  httpHeaders: []

startupProbe:
  enabled: true
  # Empty derives the path from keycloak.httpRelativePath.
  path: ""
  port: 9000
  scheme: HTTP
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 120
  httpHeaders: []

# ---------------------------------------------------------------------------
# Affinity — defaults to pod anti-affinity for HA
# ---------------------------------------------------------------------------
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/component
              operator: NotIn
              values:
                - test
        topologyKey: kubernetes.io/hostname
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: NotIn
                values:
                  - test
          topologyKey: failure-domain.beta.kubernetes.io/zone

# ---------------------------------------------------------------------------
# Extra configuration
# ---------------------------------------------------------------------------
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# ---------------------------------------------------------------------------
# GCP / Workload Identity
# ---------------------------------------------------------------------------
gcp:
  workloadIdentity:
    enabled: false
    gcpServiceAccountName: ""
    gcpProjectId: ""

cloudSqlProxy:
  enabled: false
  image:
    repository: gcr.io/cloud-sql-connectors/cloud-sql-proxy
    tag: "2.21.1"
    pullPolicy: IfNotPresent
  instanceConnectionName: ""
  port: 5432
  credentialsSecret: gcp-service-account-credentials
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

# ---------------------------------------------------------------------------
# Pod annotations (merged into pod template metadata.annotations)
# ---------------------------------------------------------------------------
podAnnotations: {}
