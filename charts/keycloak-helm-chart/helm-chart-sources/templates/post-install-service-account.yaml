apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "keycloak.fullname" . }}-post-install
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "keycloak.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: post-install-scripts
          configMap:
            name: {{ include "keycloak.fullname" . }}-post-install-scripts
            defaultMode: 0755
        - name: realm-client-secrets
          secret:
            secretName: {{ .Values.realm.clientSecretsSecret }}
      containers:
        - name: bootstrap-admin-user
          image: {{- if .Values.bootstrapAdminUser.utilityImage.digest }} {{ printf "%s@%s" .Values.bootstrapAdminUser.utilityImage.repository .Values.bootstrapAdminUser.utilityImage.digest | quote }}{{- else }} {{ printf "%s:%s" .Values.bootstrapAdminUser.utilityImage.repository .Values.bootstrapAdminUser.utilityImage.tag | quote }}{{- end }}
          imagePullPolicy: {{ .Values.bootstrapAdminUser.utilityImage.pullPolicy }}
          volumeMounts:
            - name: post-install-scripts
              mountPath: /opt/bootstrap/bootstrap-admin.sh
              subPath: bootstrap-admin.sh
              readOnly: true
            - name: realm-client-secrets
              mountPath: /var/run/secrets/keycloak-clients
              readOnly: true
          env:
            - name: KEYCLOAK_URL
              value: "http://{{ include "keycloak.fullname" . }}-internal:{{ .Values.keycloak.httpPort }}{{ .Values.keycloak.httpRelativePath | trimSuffix "/" }}"
            - name: REALM
              value: {{ .Values.realm.realm | quote }}
            - name: REALM_LOGIN_THEME
              value: {{ .Values.realm.loginTheme | quote }}

            - name: ADMIN_USERNAME
              value: {{ .Values.bootstrapAdminUser.username | quote }}
            - name: ADMIN_EMAIL
              value: {{ .Values.bootstrapAdminUser.email | quote }}
            - name: ADMIN_FIRST_NAME
              value: {{ .Values.bootstrapAdminUser.firstName | quote }}
            - name: ADMIN_LAST_NAME
              value: {{ .Values.bootstrapAdminUser.lastName | quote }}

            - name: ADMIN_TENANT_DID
              value: {{ required "bootstrapAdminUser.tenantDid is required" .Values.bootstrapAdminUser.tenantDid | quote }}

            - name: ADMIN_ACTOR_DID
              value: {{ required "bootstrapAdminUser.actorDid is required" .Values.bootstrapAdminUser.actorDid | quote }}

            - name: ADMIN_ACTOR_TYPE
              value: {{ required "bootstrapAdminUser.actorType is required" .Values.bootstrapAdminUser.actorType | quote }}

            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrapAdminUser.passwordSecret }}
                  key: password

            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminCredentialsSecret }}
                  key: KEYCLOAK_ADMIN

            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminCredentialsSecret }}
                  key: KEYCLOAK_ADMIN_PASSWORD

            - name: FORWARDMEASURE_ROLE_VIEWER
              value: {{ default "platform-viewer" .Values.bootstrapAdminUser.platformRoles.viewer | quote }}

            - name: FORWARDMEASURE_ROLE_ACCESS_ADMIN
              value: {{ default "platform-access-admin" .Values.bootstrapAdminUser.platformRoles.accessAdmin | quote }}

            - name: FORWARDMEASURE_ROLE_PLATFORM_ADMIN
              value: {{ default "platform-admin" .Values.bootstrapAdminUser.platformRoles.platformAdmin | quote }}

            - name: FORWARDMEASURE_ADMIN_PUBLIC_CLIENT_ID
              value: {{ .Values.realm.adminPublicClient.clientId | quote }}

            - name: FORWARDMEASURE_ADMIN_PUBLIC_REDIRECT_URI_1
              value: {{ .Values.realm.adminPublicClient.redirectUri1 | quote }}

            - name: FORWARDMEASURE_ADMIN_PUBLIC_REDIRECT_URI_2
              value: {{ .Values.realm.adminPublicClient.redirectUri2 | quote }}

            - name: FORWARDMEASURE_ADMIN_PUBLIC_ADDITIONAL_REDIRECT_URIS_JSON
              value: {{ .Values.realm.adminPublicClient.additionalRedirectUris | default (list) | toJson | quote }}

            - name: FORWARDMEASURE_ADMIN_PUBLIC_WEB_ORIGIN_1
              value: {{ .Values.realm.adminPublicClient.webOrigin1 | quote }}

            - name: FORWARDMEASURE_ADMIN_PUBLIC_WEB_ORIGIN_2
              value: {{ .Values.realm.adminPublicClient.webOrigin2 | quote }}

            - name: FORWARDMEASURE_ADMIN_PUBLIC_ADDITIONAL_WEB_ORIGINS_JSON
              value: {{ .Values.realm.adminPublicClient.additionalWebOrigins | default (list) | toJson | quote }}

            - name: FORWARDMEASURE_ADMIN_PUBLIC_POST_LOGOUT_REDIRECT_URIS
              value: {{ .Values.realm.adminPublicClient.postLogoutRedirectUris | quote }}

            - name: FORWARDMEASURE_ADMIN_PUBLIC_AUDIENCES_JSON
              value: {{ .Values.realm.adminPublicClient.audiences | default (list) | toJson | quote }}

            - name: FORWARDMEASURE_ADMIN_CONFIDENTIAL_CLIENT_ID
              value: {{ .Values.realm.adminConfidentialClient.clientId | quote }}

            - name: FORWARDMEASURE_SERVICE_CLIENTS_JSON
              value: {{ .Values.realm.serviceClients | default (list) | toJson | quote }}

            - name: FORWARDMEASURE_SERVICE_CLIENT_SECRETS_DIRECTORY
              value: /var/run/secrets/keycloak-clients

            - name: KEYCLOAK_REALM_MGMT_ROLES
              value: {{ default "manage-clients,manage-users,manage-realm,view-clients,view-users,query-clients,query-users" .Values.bootstrapAdminUser.keycloakRealmManagementRoles | quote }}

            - name: FORWARDMEASURE_TENANT_GROUP_ROLES
              value: {{ default "" .Values.bootstrapAdminUser.tenantGroupRoles | quote }}

            - name: KEYCLOAK_READY_SLEEP_SECONDS
              value: {{ default 5 .Values.bootstrapAdminUser.keycloakReadySleepSeconds | quote }}

            - name: KEYCLOAK_READY_MAX_ATTEMPTS
              value: {{ default 60 .Values.bootstrapAdminUser.keycloakReadyMaxAttempts | quote }}

          command:
            - /bin/sh
            - /opt/bootstrap/bootstrap-admin.sh
