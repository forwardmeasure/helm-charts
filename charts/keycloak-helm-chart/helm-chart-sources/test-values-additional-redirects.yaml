realm:
  serviceClients:
    - clientId: oks-operation-adapter-example
      name: Example Tenant OKS Operation Adapter
      secretKey: OKS_OPERATION_ADAPTER_EXAMPLE_CLIENT_SECRET
      realmRoles: [workflow-internal]
      audiences: [entity-intelligence-internal]
      claims:
        tenant_did: did:web:tenant.platform.example.com
        actor_did: did:web:tenant.platform.example.com:actors:oks-operation-adapter
        actor_type: SERVICE
  adminPublicClient:
    redirectUri1: https://dashboard.platform.example.com/*
    redirectUri2: https://workbench.platform.example.com/*
    additionalRedirectUris:
      - https://workflows.platform.example.com/*
    webOrigin1: https://dashboard.platform.example.com
    webOrigin2: https://workbench.platform.example.com
    additionalWebOrigins:
      - https://workflows.platform.example.com
    postLogoutRedirectUris: https://dashboard.platform.example.com/*##https://workbench.platform.example.com/*##https://workflows.platform.example.com/*
