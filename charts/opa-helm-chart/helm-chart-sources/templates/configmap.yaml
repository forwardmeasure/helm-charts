apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opa.policiesConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opa.labels" . | nindent 4 }}
data:
  {{- range $filename, $content := .Values.policies }}
  {{ $filename }}: |
    {{- $content | nindent 4 }}
  {{- end }}
