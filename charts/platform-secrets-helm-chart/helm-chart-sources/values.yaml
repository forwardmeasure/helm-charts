# ---------------------------------------------------------------------------
# platform-secrets values
#
# secrets: is a list of ExternalSecret definitions. Each entry controls
# which namespaces receive the secret and what remote keys to fetch.
#
# Cloud-specific secrets are added in the appropriate values layer:
#   values/platform-secrets/gcp/base.yaml.gotmpl
#   values/platform-secrets/aws/base.yaml.gotmpl
#   values/platform-secrets/azure/base.yaml.gotmpl
#
# secretStoreRef controls which ClusterSecretStore is used globally.
# Override per-cloud when switching from fake to a real backend.
# ---------------------------------------------------------------------------

secretStoreRef:
  name: fake-secret-store
  kind: ClusterSecretStore

refreshInterval: 1h

# What each Secret's content is made of, by namespace and Secret name: an opaque digest that
# changes exactly when the Secret's content does (forwardmeasure-platform's
# deploy/helmfile/scripts/credential-fingerprints.py; never a secret value). Rendered as the
# platform.forwardmeasure.com/credential-fingerprint annotation on the ExternalSecret and on its
# Secret. A Secret without one renders without the annotation.
#   credentialFingerprints:
#     keycloak:
#       keycloak-realm-client-secrets: 3f9a...
credentialFingerprints: {}

secrets: []

clusterSecretStore:
  enabled: false
  name: fake-secret-store
  provider: {}
