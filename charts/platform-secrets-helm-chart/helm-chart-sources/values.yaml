# ---------------------------------------------------------------------------
# platform-secrets values
#
# secrets: is a list of ExternalSecret definitions. Each entry controls
# which namespaces receive the secret and what remote keys to fetch.
#
# Cloud-specific secrets are added in the appropriate values layer:
#   values/platform-secrets/gcp/base.yaml.gotmpl
#   values/platform-secrets/aws/base.yaml.gotmpl
#   values/platform-secrets/azure/base.yaml.gotmpl
#
# secretStoreRef controls which ClusterSecretStore is used globally.
# Override per-cloud when switching from fake to a real backend.
# ---------------------------------------------------------------------------

secretStoreRef:
  name: fake-secret-store
  kind: ClusterSecretStore

refreshInterval: 1h

secrets: []

clusterSecretStore:
  enabled: false
  name: fake-secret-store
  provider: {}

# Kubernetes-provider ClusterSecretStores for Secrets that already live in the cluster (for example a
# cert-manager CA) rather than in the cloud secret backend. Each entry:
#   name: store name (also names its reader ServiceAccount/Role)
#   sourceNamespace: where the Secrets live
#   secretNames: the only Secrets the store may read
#   consumerNamespaces: the only namespaces whose ExternalSecrets may use the store
# A secrets: entry uses one with secretStoreRef: {name: <store>, kind: ClusterSecretStore} and
# remoteRefs whose remoteKey is the source Secret's name and property is the key inside it.
kubernetesSecretStores: []
