{{- /*
Kubernetes-provider ClusterSecretStores: copy named Secrets out of one in-cluster namespace (for
example the OpenSearch cluster's private CA) into consuming namespaces, with the narrowest grant
External Secrets needs - a ServiceAccount in this release's namespace that may only `get` the named
Secrets in the source namespace, and a store usable only from the listed consumer namespaces.
*/ -}}
{{- range .Values.kubernetesSecretStores }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}-reader
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: platform-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .name }}-reader
  namespace: {{ .sourceNamespace }}
  labels:
    app.kubernetes.io/managed-by: platform-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- range .secretNames }}
      - {{ . | quote }}
      {{- end }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .name }}-reader
  namespace: {{ .sourceNamespace }}
  labels:
    app.kubernetes.io/managed-by: platform-secrets
subjects:
  - kind: ServiceAccount
    name: {{ .name }}-reader
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .name }}-reader
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/managed-by: platform-secrets
spec:
  conditions:
    - namespaces:
        {{- range .consumerNamespaces }}
        - {{ . | quote }}
        {{- end }}
  provider:
    kubernetes:
      remoteNamespace: {{ .sourceNamespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ $.Release.Namespace }}
      auth:
        serviceAccount:
          name: {{ .name }}-reader
          namespace: {{ $.Release.Namespace }}
{{- end }}
